  <meta name="description" content="AI-powered inbound marketing engine — strategy, content, funnels and analytics."/>
  <title>Inbound Engine — Content Collectiv</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* haaylo.com brand palette — one navy, gradient accents, no pure black */
      --bg: #141B3D;
      --bg-2: #141B3D;
      --surface: #141B3D;
      --card: #1B2350;
      --soft: #1B2350;
      --ink: #F5F3FF;
      --muted: #7A82A6;
      --border: rgba(155,92,255,0.35);
      --border-soft: rgba(255,255,255,0.08);
      --white: #ffffff;

      /* Brand accent gradients (start → end) */
      --grad-pink:   linear-gradient(180deg, #FF5C93 0%, #E01F68 100%);
      --grad-purple: linear-gradient(180deg, #9B5CFF 0%, #6E1FE0 100%);
      --grad-orange: linear-gradient(180deg, #FF9B4A 0%, #E86A0E 100%);
      --grad-blue:   linear-gradient(180deg, #5FA3FF 0%, #2461E0 100%);
      --grad-green:  linear-gradient(180deg, #3FD99A 0%, #0FA968 100%);
      --grad-gray:   linear-gradient(180deg, #9AA0AC 0%, #6D7280 100%);

      /* Named end-stops for solid uses */
      --pink: #FF5C93;      --pink-deep: #E01F68;
      --purple: #9B5CFF;    --purple-deep: #6E1FE0;
      --orange: #FF9B4A;    --orange-deep: #E86A0E;
      --blue: #5FA3FF;      --blue-deep: #2461E0;
      --green: #3FD99A;     --green-deep: #0FA968;
      --gray-1: #9AA0AC;    --gray-deep: #6D7280;

      /* Legacy alias remap (keeps existing usages on-brand) */
      --violet: #9B5CFF;
      --violet-2: #6E1FE0;
      --cyan: #5FA3FF;
      --yellow: #FF5C93;
      --gold: #FF5C93;
      --red: #E01F68;
      --grad: var(--grad-purple);
      --grad-2: linear-gradient(120deg, #FF5C93 0%, #9B5CFF 50%, #5FA3FF 100%);
      --grad-text: linear-gradient(120deg, #FF5C93, #9B5CFF 50%, #5FA3FF);

      --shadow: 0 12px 28px -6px rgba(20,27,61,0.55), 0 4px 8px -2px rgba(110,31,224,0.32);
      --glow-violet: 0 0 60px rgba(155,92,255,0.45);
      --glow-cyan: 0 0 50px rgba(95,163,255,0.35);
    }
    html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100%;
      overscroll-behavior: none; -webkit-font-smoothing: antialiased;
      position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1200px 800px at 20% 0%, rgba(95,163,255,0.06), transparent 65%),
        radial-gradient(1000px 700px at 80% 100%, rgba(155,92,255,0.05), transparent 65%);
    }
    body > * { position: relative; z-index: 1; }

    ::selection { background: var(--yellow); color: #0B0B1F; }

    /* NAV */
    .topnav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; padding-top: max(14px, env(safe-area-inset-top));
      background: var(--bg); backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid var(--border-soft);
    }
    .logo { font-family: 'Archivo Black', sans-serif; font-weight: 900; font-size: 17px; letter-spacing: -.02em; color: var(--ink); text-transform: uppercase; }
    .logo span { background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-badge { font-family:'Space Grotesk',sans-serif; font-size: 10px; font-weight: 700; color: var(--yellow); background: rgba(250,204,21,0.12); border: 1px solid rgba(250,204,21,0.4); padding: 3px 10px; border-radius: 100px; text-transform: uppercase; letter-spacing: .14em; }
    .gen-coin { position: relative; border: 0; padding: 2px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 18px rgba(124,58,237,0.35), inset 0 0 0 1px rgba(255,255,255,0.15); transition: transform .18s ease, box-shadow .2s ease; }
    .gen-coin:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 10px 24px rgba(124,58,237,0.5); }
    .gen-coin.warn { box-shadow: 0 6px 18px rgba(245,158,11,0.45), inset 0 0 0 1px rgba(255,255,255,0.15); }
    .gen-coin.danger { box-shadow: 0 6px 18px rgba(239,68,68,0.5), inset 0 0 0 1px rgba(255,255,255,0.15); animation: coinPulse 1.6s ease-in-out infinite; }
    .gen-coin-inner { display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; background: #0B0B1F; border-radius: 999px; font-family: 'Archivo Black', sans-serif; color: #F5F3FF; }
    .gen-coin-icon { font-size: 14px; filter: drop-shadow(0 0 6px rgba(250,204,21,0.7)); }
    .gen-coin-num { font-size: 14px; letter-spacing: .02em; min-width: 14px; text-align: center; }
    @keyframes coinPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .install-btn { font-size: 12px; font-weight: 800; background: var(--grad); color:#fff; border:none; padding: 9px 18px; border-radius:100px; cursor:pointer; display:none; font-family:'Space Grotesk',sans-serif; box-shadow: var(--shadow); letter-spacing: .02em; }
    .install-btn.show { display:block; }

    .layout { display: flex; min-height: calc(100vh - 57px); }

    /* SIDEBAR */
    .sidebar {
      width: 248px; flex-shrink: 0;
      border-right: 1px solid var(--border-soft);
      padding: 24px 14px; background: var(--bg); backdrop-filter: blur(10px);
      position: sticky; top: 57px; height: calc(100vh - 57px);
      overflow-y: auto;
    }
    .sidebar-section { font-family:'Space Grotesk',sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .18em; color: var(--cyan); padding: 0 10px; margin: 20px 0 8px; }
    .sidebar-section:first-child { margin-top: 0; }

    /* Brain health widget */
    .brain-widget {
      display: block;
      text-decoration: none;
      padding: 10px 12px 14px;
      margin: 0 0 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      transition: background .15s, border-color .15s;
    }
    .brain-widget:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .brain-widget-inner { position: relative; width: 100%; max-width: 120px; margin: 0 auto; }
    .brain-img {
      display: block;
      width: 100%;
      height: auto;
    }
    .brain-img.brain-grey {
      filter: grayscale(100%) brightness(0.45) opacity(0.7);
    }
    .brain-img.brain-color {
      position: absolute;
      inset: 0;
      object-fit: contain;
    }
    .brain-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .brain-pct {
      font-family: 'Archivo Black', sans-serif;
      font-size: 22px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      line-height: 1;
    }
    .brain-label {
      font-size: 9px;
      color: #b9b9d4;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 2px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .nav-btn {

      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 11px 12px; border-radius: 12px; border: 1px solid transparent;
      background: none; color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s; text-align: left; font-family: 'Inter', sans-serif;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.04); color: var(--ink); }
    .nav-btn.active { background: linear-gradient(120deg, rgba(124,58,237,0.22), rgba(34,211,238,0.14)); border-color: var(--border); color: var(--white); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }
    .nav-btn.locked { opacity:.48; filter:grayscale(.55); cursor:not-allowed; }
    .nav-btn.locked:hover { background: rgba(255,255,255,0.02); color: var(--muted); }
    .nav-btn .ni { font-size: 16px; width: 24px; height: 24px; text-align: center; flex-shrink: 0; display:inline-flex; align-items:center; justify-content:center; }
    .nav-btn .ni img { width: 24px; height: 24px; display:block; filter: drop-shadow(0 2px 4px rgba(20,27,61,0.5)); }
    .nav-btn .nl { margin-left: auto; font-size: 10px; opacity:.5; }
    .lock-pill { margin-left:auto; font-size:9px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#FDE68A; background:rgba(250,204,21,.10); border:1px solid rgba(250,204,21,.28); border-radius:999px; padding:3px 6px; white-space:nowrap; }

    .main { flex: 1; padding: 44px 48px; max-width: 1000px; padding-bottom: 100px; }

    /* BOTTOM NAV (mobile) */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-soft);
      padding: 6px 4px; padding-bottom: max(6px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .bottom-nav { display: none; }
    @media(max-width:680px) { .bottom-nav { display: grid; grid-template-columns: repeat(9, minmax(56px, 1fr)); gap: 0; overflow-x:auto; scrollbar-width: none; } .bottom-nav::-webkit-scrollbar { display:none; } }
    .bn-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px; background:none; border:none; color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; font-family:'Inter',sans-serif; transition: color .15s; min-width:0; width:100%; overflow:hidden; }
    .bn-item .bni { font-size:18px; line-height:1; height:26px; display:inline-flex; align-items:center; justify-content:center; }
    .bn-item .bni img { width: 26px; height: 26px; display:block; filter: drop-shadow(0 2px 4px rgba(20,27,61,0.55)); transition: transform .15s; }
    .bn-item .bnl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .bn-item.active { color: var(--pink, #FF5C93); }
    .bn-item.active .bni img { transform: translateY(-1px) scale(1.06); filter: drop-shadow(0 4px 10px rgba(255,92,147,0.55)); }
    .bn-item.locked { opacity:.42; filter:grayscale(.7); }
    .bn-item.locked::after { content:'🔒'; position:absolute; top:3px; right:7px; font-size:10px; }

    /* ACTION BUTTONS (Copy / PDF) */
    .out-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; padding-top:18px; border-top:1px solid var(--border-soft); }
    .out-action { display:inline-flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:800; padding:9px 16px; border-radius:100px; cursor:pointer; letter-spacing:.04em; transition: all .15s; border:1px solid transparent; }
    .out-action.primary { background: var(--yellow); color:#0B0B1F; border-color: var(--yellow); }
    .out-action.primary:hover { box-shadow: 0 6px 18px rgba(250,204,21,.45); transform: translateY(-1px); }
    .out-action.ghost { background: rgba(124,58,237,0.14); color: #E9D5FF; border-color: rgba(124,58,237,0.55); }
    .out-action.ghost:hover { background: rgba(124,58,237,0.28); }

    /* SAVED BANNER */
    .saved-banner { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background: linear-gradient(120deg, rgba(34,211,238,0.10), rgba(124,58,237,0.08)); border:1px solid rgba(34,211,238,0.35); border-radius:14px; padding:12px 16px; margin-bottom:20px; font-size:13px; color:var(--ink); }
    .saved-banner .sb-dot { width:8px; height:8px; border-radius:50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); flex-shrink:0; }
    .saved-banner .sb-time { font-family:'Space Grotesk',sans-serif; color: var(--muted); font-weight:600; }
    .saved-banner button { margin-left:auto; background: transparent; border:1px solid rgba(255,255,255,0.18); color: var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:6px 12px; border-radius:100px; cursor:pointer; }
    .saved-banner button:hover { border-color: var(--yellow); color: var(--yellow); }

    /* MODULE STEP INDICATOR */
    .mstep { display:inline-flex; align-items:center; gap:10px; background: rgba(124,58,237,0.12); border:1px solid rgba(124,58,237,0.4); border-radius:100px; padding:7px 14px; margin-bottom:18px; font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:800; color: #E9D5FF; letter-spacing:.12em; text-transform:uppercase; }
    .mstep .mst-pip { display:flex; gap:4px; }
    .mstep .mst-pip i { display:block; width:18px; height:4px; border-radius:2px; background: rgba(255,255,255,0.14); }
    .mstep .mst-pip i.on { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .mstep .mst-pip i.done { background: var(--cyan); }

    /* MODULE HEADER */
    .mh { margin-bottom: 36px; }
    .mtag { display:inline-block; font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.2em; color:var(--yellow); background:rgba(250,204,21,0.1); padding:6px 14px; border-radius:100px; border:1px solid rgba(250,204,21,0.3); margin-bottom:16px; }
    .mtitle { font-family:'Archivo Black',sans-serif; font-size:clamp(36px,5vw,56px); font-weight:900; letter-spacing:-.035em; line-height:0.95; margin-bottom:14px; color: var(--ink); text-transform: none; }
    .mtitle em { font-style: normal; background: var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .mdesc { font-size:17px; color:var(--muted); line-height:1.55; max-width:620px; }

    /* FORMS */
    .fg { display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
    .fr { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field label { font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:.12em; }
    .field input, .field textarea, .field select {
      background: rgba(255,255,255,0.04); border:1px solid var(--border-soft); border-radius:12px;
      color:var(--ink); font-family:'Inter',sans-serif; font-size:14px;
      padding:12px 14px; outline:none; transition: all .15s; width:100%;
    }
    .field input::placeholder, .field textarea::placeholder { color: rgba(154,147,199,0.6); }
    .field input:focus,.field textarea:focus,.field select:focus { border-color:var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,0.18); background: rgba(255,255,255,0.06); }
    .field textarea { resize:vertical; min-height:90px; }
    .field select option { background:var(--bg-2); color:var(--ink); }

    /* BUTTONS */
    .btn {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--grad); color:#fff; border:none; padding:14px 28px; border-radius:100px;
      font-size:14px; font-weight:800; cursor:pointer; letter-spacing: .01em;
      transition:all .2s; font-family:'Space Grotesk',sans-serif;
      box-shadow: 0 10px 30px -6px rgba(124,58,237,0.55);
      position: relative; overflow: hidden;
    }
    .btn::before { content:''; position:absolute; inset:0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%); transform: translateX(-100%); transition: transform .6s; }
    .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow: 0 16px 40px -6px rgba(124,58,237,0.7), 0 0 0 1px rgba(255,255,255,0.1) inset; }
    .btn:hover:not(:disabled)::before { transform: translateX(100%); }
    .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow: none; }
    .btn-ghost { background:transparent; border:1.5px solid var(--border); color:var(--ink); box-shadow:none; }
    .btn-ghost::before { display:none; }
    .btn-ghost:hover:not(:disabled) { background:rgba(255,255,255,0.05); border-color: var(--cyan); color: var(--cyan); box-shadow: none; transform: translateY(-1px); }
    .btn-yellow { background: var(--yellow); color: #0B0B1F; box-shadow: 0 10px 30px -6px rgba(250,204,21,0.55); }
    .btn-yellow:hover:not(:disabled) { box-shadow: 0 16px 40px -6px rgba(250,204,21,0.75); }
    .btn-sm { padding:10px 20px; font-size:13px; }
    .btn-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }

    /* OUTPUT */
    .out-box { background: linear-gradient(160deg, rgba(124,58,237,0.08), rgba(34,211,238,0.04)); border:1px solid var(--border-soft); border-radius:20px; padding:28px; margin-top:24px; position:relative; box-shadow: var(--shadow); }
    .out-label { font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.18em; color:var(--cyan); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .out-content { font-size:14.5px; line-height:1.8; color:var(--ink); }
    .out-content h2 { font-family:'Archivo Black',sans-serif; font-size:22px; font-weight:900; color:var(--white); margin:22px 0 10px; letter-spacing:-.02em; }
    .out-content h3 { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; color:var(--yellow); margin:16px 0 6px; text-transform:uppercase; letter-spacing:.14em; }
    .out-content p { margin-bottom:8px; color: rgba(245,243,255,0.85); }
    .out-content strong { color:var(--white); font-weight:700; }
    .out-content ul,.out-content ol { padding-left:20px; }
    .out-content li { margin-bottom:6px; color: rgba(245,243,255,0.85); }
    .out-content hr { border:none; border-top:1px solid var(--border-soft); margin:20px 0; }
    .copy-btn { position:absolute; top:18px; right:18px; background:rgba(34,211,238,0.12); border:1px solid rgba(34,211,238,0.35); color:var(--cyan); font-size:11px; font-weight:700; padding:7px 14px; border-radius:100px; cursor:pointer; transition:all .15s; font-family:'Space Grotesk',sans-serif; letter-spacing: .05em; }
    .copy-btn:hover { background:rgba(34,211,238,0.22); }

    /* LOADING */
    .loading { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; padding:16px 0; }
    .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.1); border-top-color:var(--cyan); border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--cyan); animation:pulse 1.4s ease infinite; flex-shrink:0; box-shadow: 0 0 12px var(--cyan); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    .gen-loading { padding:18px 0 6px; }
    .gen-loading-row { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }
    .gen-estimate { font-size:12px; color:var(--muted); opacity:.8; margin-top:6px; }
    .gen-progress { height:4px; border-radius:99px; background:rgba(255,255,255,0.08); overflow:hidden; margin-top:12px; }
    .gen-progress > i { display:block; height:100%; width:40%; border-radius:99px; background:linear-gradient(90deg,var(--cyan),#a855f7); animation:genBarSlide 1.4s ease-in-out infinite; }
    @keyframes genBarSlide { 0%{ transform:translateX(-100%);} 100%{ transform:translateX(260%);} }
    @keyframes stepGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(244,114,182,0.55), 0 0 0 1px rgba(244,114,182,0.55); background: rgba(244,114,182,0.14); }
      50%     { box-shadow: 0 0 0 8px rgba(244,114,182,0), 0 0 0 1px rgba(244,114,182,0.9); background: rgba(244,114,182,0.28); }
    }

    /* TABS */
    .tabs { display:flex; gap:4px; margin-bottom:26px; background:rgba(255,255,255,0.04); border-radius:100px; padding:5px; border:1px solid var(--border-soft); width:fit-content; flex-wrap:wrap; }
    .tab { padding:9px 18px; border-radius:100px; font-size:13px; font-weight:700; cursor:pointer; border:none; background:none; color:var(--muted); transition:all .15s; font-family:'Space Grotesk',sans-serif; letter-spacing: .02em; }
    .tab:hover { color: var(--ink); }
    .tab.active { background:var(--grad); color:#fff; box-shadow: 0 6px 18px rgba(124,58,237,0.45); }

    /* PROGRESS */
    .prog { display:flex; align-items:center; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
    .ps { display:flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; color:var(--muted); }
    .ps.done { color:var(--green); }
    .ps.active { color:var(--cyan); }
    .pn { width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.04); border:1.5px solid var(--border-soft); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
    .ps.done .pn { background:var(--green); border-color:var(--green); color:#0B0B1F; }
    .ps.active .pn { background:var(--cyan); border-color:var(--cyan); color:#0B0B1F; box-shadow: 0 0 14px var(--cyan); }
    .pline { flex:1; height:1.5px; background:var(--border-soft); max-width:32px; }

    /* HOME GRID */
    .home-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px; }
    .hcard { background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); border:1px solid var(--border-soft); border-radius:20px; padding:24px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
    .hcard::after { content:''; position:absolute; inset:0; border-radius:20px; padding:1px; background: linear-gradient(135deg, transparent 40%, var(--cyan) 50%, transparent 60%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity:0; transition: opacity .3s; pointer-events:none; }
    .hcard:hover { transform:translateY(-4px); background: linear-gradient(160deg, rgba(124,58,237,0.14), rgba(34,211,238,0.06)); box-shadow: var(--shadow); }
    .hcard:hover::after { opacity:1; }
    .hcard::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad); }
    .hcard .hi { font-size:34px; margin-bottom:14px; filter: drop-shadow(0 4px 14px rgba(124,58,237,0.5)); }
    .hcard h3 { font-family:'Archivo Black',sans-serif; font-size:18px; font-weight:900; margin-bottom:8px; line-height:1.15; color:var(--white); letter-spacing:-.02em; }
    .hcard p { font-size:13.5px; color:var(--muted); line-height:1.55; }
    .hcard .hb { display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:.12em; }
    .hcard.disabled { opacity:.5; cursor:default; }
    .hcard.disabled:hover { transform:none; box-shadow:none; }

    /* HERO (landing) */
    .hero { padding: 24px 0 8px; margin-bottom: 32px; }
    .hero-eyebrow { display:inline-flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--yellow); background:rgba(250,204,21,0.08); border:1px solid rgba(250,204,21,0.3); padding:7px 14px; border-radius:100px; margin-bottom:22px; }
    .hero-eyebrow .pulse-dot { width:7px; height:7px; border-radius:50%; background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation: pulse 1.6s ease infinite; }
    .hero h1 { font-family:'Archivo Black',sans-serif; font-size: clamp(48px, 8vw, 92px); line-height: 0.92; letter-spacing: -.045em; font-weight: 900; color: var(--white); margin-bottom: 24px; text-align: left; }
    .hero h1 .a { color: #F6F4EF; display:inline-block; }
    .hero h1 .b { display:inline-block; background: var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero p.lede { font-size: 19px; line-height: 1.55; color: var(--muted); max-width: 680px; margin-bottom: 28px; }
    .hero p.lede strong { color: var(--white); font-weight: 700; }
    .hero-cta-row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom: 18px; }
    .hero-meta { display:flex; flex-wrap:wrap; gap:18px; align-items:center; font-family:'Space Grotesk',sans-serif; font-size:12px; color: var(--muted); }
    .hero-meta .tick { color: var(--green); margin-right:6px; }

    /* MARQUEE */
    .marquee { overflow:hidden; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding:14px 0; margin: 32px 0; background: rgba(255,255,255,0.02); }
    .marquee-track { display:flex; gap:60px; white-space:nowrap; animation: marquee 28s linear infinite; }
    .marquee-item { font-family:'Archivo Black',sans-serif; font-size:22px; letter-spacing:-.02em; color: var(--muted); text-transform: uppercase; }
    .marquee-item .glow { background: var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .marquee-item .star { color: var(--yellow); margin: 0 22px; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* HOW IT WORKS */
    .section-head { margin: 56px 0 28px; }
    .section-tag { font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color: var(--cyan); margin-bottom: 12px; }
    .section-title { font-family:'Archivo Black',sans-serif; font-size: clamp(32px, 4.5vw, 48px); line-height: 0.98; letter-spacing: -.035em; color: var(--white); }
    .section-title em { font-style: normal; background: var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }


    /* STEPS */
    .steps-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; margin-top:24px; }
    .step { background: rgba(255,255,255,0.03); border:1px solid var(--border-soft); border-radius:16px; padding:18px 16px; position:relative; }
    .step-n { font-family:'Archivo Black',sans-serif; font-size:36px; line-height:1; background: var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-.04em; margin-bottom:8px; }
    .step-h { font-family:'Archivo Black',sans-serif; font-size:14px; color:var(--white); margin-bottom:5px; letter-spacing:-.01em; line-height:1.15; }
    .step-d { font-size:12.5px; color:var(--muted); line-height:1.5; }

    /* STATS */
    .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin: 40px 0; }
    .stat { background: rgba(255,255,255,0.03); border:1px solid var(--border-soft); border-radius:18px; padding:22px; }
    .stat .sv { font-family:'Archivo Black',sans-serif; font-size:38px; line-height:1; letter-spacing:-.04em; background: var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .stat .sl { font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin-top:8px; }

    /* CTA BANNER */
    .cta-banner { margin: 48px 0 8px; background: linear-gradient(120deg, rgba(168,85,247,0.18), rgba(34,211,238,0.12)); border: 1px solid var(--border); border-radius: 24px; padding: 36px 32px; position: relative; overflow: hidden; }
    .cta-banner::before { content:''; position:absolute; top:-40%; right:-10%; width:380px; height:380px; background: radial-gradient(closest-side, rgba(250,204,21,0.35), transparent); pointer-events:none; }
    .cta-banner h3 { font-family:'Archivo Black',sans-serif; font-size: clamp(28px, 4vw, 38px); line-height:1; letter-spacing:-.03em; color:var(--white); margin-bottom:10px; max-width:580px; }
    .cta-banner p { font-size:15px; color:var(--muted); max-width:540px; margin-bottom:20px; }
    .price-bubble { display:inline-flex; align-items:baseline; gap:8px; font-family:'Archivo Black',sans-serif; }
    .price-bubble .amt { font-size:52px; line-height:1; background: linear-gradient(120deg, #FACC15, #FF3D9A); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-.04em; }
    .price-bubble .meta { font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.04em; }

    /* INFO BOX */
    .info-box { background: linear-gradient(160deg, rgba(52,211,153,0.1), rgba(52,211,153,0.04)); border:1px solid rgba(52,211,153,0.35); border-radius:14px; padding:18px 20px; margin-bottom:20px; }
    .info-box h4 { font-family:'Archivo Black',sans-serif; font-size:15px; font-weight:900; margin-bottom:5px; color: var(--white); }
    .info-box p { font-size:13.5px; color:var(--muted); line-height:1.55; }
    .warn-box { background: linear-gradient(160deg, rgba(250,204,21,0.12), rgba(250,204,21,0.04)); border:1px solid rgba(250,204,21,0.4); border-radius:14px; padding:18px 20px; margin-bottom:20px; }
    .warn-box p { font-size:13.5px; color:var(--ink); line-height:1.55; }

    /* CHIPS */
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .chip { background:rgba(255,255,255,0.04); border:1px solid var(--border-soft); border-radius:100px; padding:7px 14px; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; transition:all .15s; font-family:'Inter',sans-serif; }
    .chip:hover { background:rgba(34,211,238,0.1); border-color: var(--cyan); }
    .chip.selected { background:var(--grad); border-color:transparent; color:#fff; }

    /* ANALYTICS */
    .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
    .metric-card { background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); border:1px solid var(--border-soft); border-radius:18px; padding:22px; }
    .metric-card .mv { font-family:'Archivo Black',sans-serif; font-size:36px; font-weight:900; background:var(--grad-text); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; letter-spacing:-.04em; }
    .metric-card .ml { font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.14em; margin-top:8px; font-weight:700; }
    .metric-card .mt { font-size:12px; color:var(--green); margin-top:6px; font-weight:700; }
    .chart-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .chart-bar-label { font-size:12px; color:var(--muted); width:80px; flex-shrink:0; text-align:right; font-weight:600; }
    .chart-bar-track { flex:1; background:rgba(255,255,255,0.05); border-radius:6px; height:10px; overflow:hidden; }
    .chart-bar-fill { height:100%; border-radius:6px; background:var(--grad); transition:width .6s ease; box-shadow: 0 0 10px rgba(124,58,237,0.5); }
    .chart-bar-val { font-size:12px; color:var(--ink); width:32px; font-weight:700; }

    /* BRAND VOICE */
    .bv-saved { background: linear-gradient(160deg, rgba(52,211,153,0.1), rgba(52,211,153,0.04)); border:1px solid rgba(52,211,153,0.35); border-radius:12px; padding:16px 18px; font-size:13px; color:var(--ink); line-height:1.6; margin-top:16px; }

    /* TOAST */
    .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:#141B3D; border:1px solid rgba(255,255,255,0.08); color:#F5F3FF; font-size:13px; font-weight:700; padding:10px 18px 10px 12px; border-radius:100px; opacity:0; transition:all .3s; pointer-events:none; z-index:999; white-space:nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 24px rgba(155,92,255,0.25); display:inline-flex; align-items:center; gap:10px; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast img.blab { width:28px; height:28px; border-radius:8px; display:block; filter: drop-shadow(0 3px 6px rgba(20,27,61,0.6)); flex-shrink:0; }
    .toast.ok { border-color: rgba(63,217,154,0.6); box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 24px rgba(63,217,154,0.35); }
    .toast.err { border-color: rgba(224,31,104,0.6); box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 24px rgba(224,31,104,0.35); }
    .toast.think { border-color: rgba(155,92,255,0.6); box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 24px rgba(155,92,255,0.4); }

    /* PAYWALL */
    .pw-overlay { position:fixed; inset:0; background:rgba(11,11,31,0.75); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .pw-modal { position:relative; background: linear-gradient(160deg, #1E1B40, #14122E); border-radius:24px; padding:40px 34px 30px; max-width:480px; width:100%; box-shadow:0 40px 100px rgba(0,0,0,0.55), 0 0 0 1px var(--border); animation:slideUp .25s ease; }
    @keyframes slideUp { from{transform:translateY(20px); opacity:0} to{transform:translateY(0); opacity:1} }
    .pw-close { position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,0.06); color:var(--muted); font-size:14px; cursor:pointer; }
    .pw-close:hover { background:rgba(255,255,255,0.12); color:var(--white); }
    .pw-tag { display:inline-block; background:rgba(250,204,21,0.12); color:var(--yellow); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; padding:6px 12px; border-radius:100px; margin-bottom:14px; border:1px solid rgba(250,204,21,0.3); }
    .pw-title { font-family:'Archivo Black',sans-serif; font-size:28px; font-weight:900; color:var(--white); margin:0 0 10px; line-height:1.05; letter-spacing:-.03em; }
    .pw-desc { font-size:14.5px; color:var(--muted); line-height:1.55; margin:0 0 22px; }
    .pw-price { display:flex; align-items:baseline; gap:10px; margin-bottom:20px; padding:16px 18px; background: linear-gradient(120deg, rgba(124,58,237,0.18), rgba(34,211,238,0.1)); border:1px solid var(--border); border-radius:14px; }
    .pw-amt { font-family:'Archivo Black',sans-serif; font-size:40px; font-weight:900; background: linear-gradient(120deg, #FACC15, #FF3D9A); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:-.03em; }
    .pw-meta { font-family:'Space Grotesk',sans-serif; font-size:12px; color:var(--muted); font-weight:600; }
    .pw-list { list-style:none; padding:0; margin:0 0 22px; font-size:14px; color:var(--ink); }
    .pw-list li { padding:6px 0; line-height:1.5; }
    .pw-email { width:100%; padding:13px 16px; border:1px solid var(--border-soft); border-radius:12px; font-family:'Inter',sans-serif; font-size:14px; margin-bottom:12px; box-sizing:border-box; background: rgba(255,255,255,0.04); color: var(--ink); }
    .pw-email::placeholder { color: rgba(154,147,199,0.6); }
    .pw-email:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,0.18); }
    .pw-btn { width:100%; padding:15px 18px; background:var(--grad); color:#fff; border:none; border-radius:100px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 10px 26px rgba(124,58,237,0.45); transition:transform .15s; letter-spacing:.02em; }
    .pw-btn:hover:not(:disabled) { transform:translateY(-1px); }
    .pw-btn:disabled { opacity:0.6; cursor:wait; }
    .pw-fine { font-size:11.5px; color:var(--muted); text-align:center; margin:14px 0 0; line-height:1.55; }
    .pw-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(52,211,153,0.12); color:var(--green); border:1px solid rgba(52,211,153,0.35); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; padding:6px 12px; border-radius:100px; }

    /* RESPONSIVE */
    @media(max-width:900px) {
      .steps-grid { grid-template-columns: repeat(2,1fr); }
      .stats { grid-template-columns: repeat(2,1fr); }
    }
    @media(max-width:680px) {
      html, body { overflow-x: hidden; max-width: 100vw; }
      .layout { min-width: 0; max-width: 100vw; }
      .sidebar { display:none; }
      /* bottom-nav handled in its own @media block */
      .main { padding:24px 16px; padding-bottom:96px; min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box; }
      .home-grid { grid-template-columns:1fr; }
      .fr { grid-template-columns:1fr; }
      .metric-grid { grid-template-columns:1fr 1fr; }
      .hero { padding: 8px 0 4px; margin-bottom: 20px; }
      .hero h1 { font-size: clamp(32px, 9vw, 40px) !important; line-height: 0.95; letter-spacing: -.03em; word-wrap: break-word; }
      .hero p.lede { font-size: 15px; max-width: 100%; }
      .hero-cta-row { flex-direction: column; gap: 10px; }
      .hero-meta { flex-wrap: wrap; gap: 10px 14px; font-size: 12px; }
      .marquee { margin: 22px -16px; }
      .marquee-item { font-size: 16px; }
      .section-title { font-size: clamp(24px, 6.5vw, 32px); }
      img, svg, video { max-width: 100%; height: auto; }
    }


    /* SUGGESTION PANEL (from-Strategy cards) */
    .sugg-panel { margin-top: 28px; padding: 24px; background: linear-gradient(160deg, rgba(250,204,21,0.08), rgba(124,58,237,0.05)); border:1px solid rgba(250,204,21,0.28); border-radius:20px; }
    .sugg-head { margin-bottom: 18px; }
    .sugg-tag { font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--yellow); margin-bottom: 6px; }
    .sugg-title { font-family:'Archivo Black',sans-serif; font-size: 22px; letter-spacing:-.02em; color: var(--white); line-height: 1.15; }
    .sugg-pillar { margin-bottom: 22px; }
    .sugg-pillar:last-child { margin-bottom: 0; }
    .sugg-pillar-name { font-family:'Space Grotesk',sans-serif; font-size: 12px; font-weight: 800; letter-spacing:.1em; text-transform: uppercase; color: var(--cyan); margin: 14px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--border-soft); }
    .sugg-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    /* An open draft takes the full row so there's room to write and edit. */
    .sugg-card:has(.draft-open) { grid-column: 1 / -1; }
    .sugg-card { background: rgba(255,255,255,0.04); border:1px solid var(--border-soft); border-radius:14px; padding: 14px 14px 12px; display:flex; flex-direction:column; gap:10px; transition: all .15s; min-width: 0; max-width: 100%; box-sizing: border-box; overflow: hidden; }
    .sugg-card > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
    .sugg-card select { min-width: 0; max-width: 100%; box-sizing: border-box; text-overflow: ellipsis; }
    .sugg-card:hover { border-color: var(--cyan); background: rgba(34,211,238,0.06); transform: translateY(-2px); }
    .sugg-card-week { font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color: var(--yellow); }
    .sugg-card-topic { font-size: 13.5px; line-height: 1.45; color: var(--ink); font-weight: 500; flex: 1; overflow-wrap: anywhere; }
    .sugg-write-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background: var(--yellow); color: #0B0B1F; border: none; border-radius: 100px; font-family:'Space Grotesk',sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; padding: 9px 12px; cursor: pointer; transition: all .15s; min-width: 0; max-width: 100%; }
    .sugg-write-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(250,204,21,0.4); }


    /* NEXT STEP BAR */
    .next-step-bar { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top: 32px; padding: 18px 22px; background: linear-gradient(120deg, rgba(124,58,237,0.18), rgba(34,211,238,0.10)); border: 1px solid var(--border); border-radius: 18px; }
    .next-step-text { display:flex; flex-direction:column; gap:3px; min-width: 0; }
    .next-step-eyebrow { font-family:'Space Grotesk',sans-serif; font-size: 10px; font-weight: 800; letter-spacing:.18em; text-transform: uppercase; color: var(--cyan); }
    .next-step-label { font-family:'Archivo Black',sans-serif; font-size: 22px; letter-spacing:-.02em; color: var(--white); line-height: 1; }

    /* HANDOFF PANEL (Competitor Radar / Trend Radar → plan) */
    .handoff-panel { margin-top: 16px; padding: 16px 18px; border-radius: 14px; background: rgba(255,92,147,0.06); border: 1px solid rgba(255,92,147,0.28); display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px; }
    .handoff-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .handoff-title { font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; }
    .handoff-sub { font-size: 12.5px; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; }
    .handoff-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .handoff-actions .btn-sm { white-space: nowrap; }
    @media(max-width:680px) {
      .handoff-panel { grid-template-columns: 1fr; padding: 14px 16px; gap: 12px; }
      .handoff-actions { justify-content: stretch; }
      .handoff-actions .btn-sm { flex: 1 1 100%; width: 100%; justify-content: center; white-space: normal; }
    }


    /* MOBILE polish */
    @media(max-width:680px) {
      .brain-block { grid-template-columns: 1fr !important; padding: 18px !important; gap: 18px !important; }
      .topnav { padding: 10px 14px; }
      .logo { font-size: 14px; }

<body>

<div id="root"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;

// ── LOCAL PERSISTENCE ──────────────────────────────────────────────────────
// Module work (ie-mod-*) is per-client. Keys are namespaced with the active
// project id so switching client never leaks another client's strategy.
function scopedKey(key) {
  if (typeof key !== 'string') return key;
  const SCOPED = ['ie-mod-', 'ie-strategy-', 'ie-written-', 'ie-card-formats', 'ie-momentum-log', 'ie-home-'];
  if (!SCOPED.some(p => key.startsWith(p))) return key;
  let pid = null;
  try { pid = localStorage.getItem('ie-active-project') || window.IE_ACTIVE_PROJECT_ID || null; } catch { pid = window.IE_ACTIVE_PROJECT_ID || null; }
  return pid ? `${key}::${pid}` : key;
}
window.scopedKey = scopedKey;
// One-time migration: legacy unscoped work belongs to the client that was
// active when it was created — adopt it into the first client we see.
function migrateLegacyKeys(pid) {
  if (!pid) return;
  try {
    if (localStorage.getItem('ie-scope-migrated') === '1') return;
    const SCOPED = ['ie-mod-', 'ie-strategy-', 'ie-written-', 'ie-card-formats', 'ie-momentum-log', 'ie-home-'];
    const keys = Object.keys(localStorage);
    keys.forEach((k) => {
      if (k.includes('::')) return;
      if (!SCOPED.some((p) => k.startsWith(p))) return;
      const target = `${k}::${pid}`;
      if (localStorage.getItem(target) == null) localStorage.setItem(target, localStorage.getItem(k));
      localStorage.removeItem(k);
    });
    localStorage.setItem('ie-scope-migrated', '1');
  } catch {}
}
window.migrateLegacyKeys = migrateLegacyKeys;
try { migrateLegacyKeys(localStorage.getItem('ie-active-project') || null); } catch {}

function loadLS(key, fallback) {
  try { const v = localStorage.getItem(scopedKey(key)); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function saveLS(key, val) { try { localStorage.setItem(scopedKey(key), JSON.stringify(val)); } catch {} }
function usePersisted(key, initial) {
  const sk = scopedKey(key);
  const [val, setVal] = useState(() => loadLS(key, initial));
  const lastKey = useRef(sk);
  useEffect(() => {
    if (lastKey.current !== sk) { lastKey.current = sk; setVal(loadLS(key, initial)); return; }
    saveLS(key, val);
  }, [sk, val]);
  return [val, setVal];
}

function useModuleSave(moduleKey) {
  // Tracks a savedAt timestamp for the module's output
  const tsKey = `ie-mod-${moduleKey}-savedAt`;
  const [savedAt, setSavedAt] = useState(() => loadLS(tsKey, null));
  const mark = () => { const t = Date.now(); saveLS(tsKey, t); setSavedAt(t); };
  const clear = () => { saveLS(tsKey, null); setSavedAt(null); };
  return { savedAt, mark, clear };
}
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

// ── SAVED BANNER ───────────────────────────────────────────────────────────
function SavedBanner({ savedAt, onClear }) {
  if (!savedAt) return null;
  return React.createElement('div', { className:'saved-banner' },
    React.createElement('span', { className:'sb-dot' }),
    React.createElement('span', null, 'Your work is restored.'),
    React.createElement('span', { className:'sb-time' }, 'Last saved ' + timeAgo(savedAt)),
    React.createElement('button', { onClick:onClear }, '↺ Start fresh')
  );
}

// ── STEP INDICATOR ─────────────────────────────────────────────────────────
function StepBar({ step, total, label }) {
  return React.createElement('div', { className:'mstep' },
    'Step ' + step + ' of ' + total + (label ? ' · ' + label : ''),
    React.createElement('span', { className:'mst-pip' },
      Array.from({length: total}).map((_,i) =>
        React.createElement('i', { key:i, className: i+1 < step ? 'done' : i+1 === step ? 'on' : '' })
      )
    )
  );
}

// ── PDF EXPORT ─────────────────────────────────────────────────────────────
function downloadAsPDF(title, text) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const M = 48; let y = M;

    // Header bar — Content Collectiv branding
    doc.setFillColor(124,58,237); doc.rect(0,0,W,6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(124,58,237);
    doc.text('CONTENT COLLECTIV', M, y); y += 6;
    doc.setDrawColor(34,211,238); doc.setLineWidth(0.7); doc.line(M, y, M+90, y);
    y += 28;

    doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(20,18,46);
    const titleLines = doc.splitTextToSize(title, W - M*2);
    titleLines.forEach(l => { doc.text(l, M, y); y += 26; });

    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120,118,150);
    doc.text('Generated ' + new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) + ' · The Inbound Engine', M, y);
    y += 22;
    doc.setDrawColor(230,228,240); doc.line(M, y, W-M, y); y += 22;

    // Body — markdown-aware
    doc.setTextColor(20,18,46);
    const lines = (text||'').split('\n');
    const ensure = (need) => { if (y + need > H - M) { doc.addPage(); y = M; } };

    lines.forEach(line => {
      let style = 'normal', size = 11, color = [40,38,70], indent = 0, gap = 5;
      let txt = line;
      if (line.startsWith('## ')) { style='bold'; size=15; color=[124,58,237]; txt=line.slice(3); gap=10; ensure(22); y += 8; }
      else if (line.startsWith('### ')) { style='bold'; size=12; color=[34,140,180]; txt=line.slice(4); gap=8; ensure(18); y += 4; }
      else if (line.startsWith('---')) { ensure(14); doc.setDrawColor(230,228,240); doc.line(M, y, W-M, y); y += 14; return; }
      else if (line.match(/^[-•]\s/)) { txt = '• ' + line.slice(2); indent = 12; }
      if (!txt.trim()) { y += 6; return; }
      // bold inline
      const segs = txt.split(/(\*\*[^*]+\*\*)/g);
      doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
      const plain = segs.map(s => s.replace(/^\*\*|\*\*$/g,'')).join('');
      const wrapped = doc.splitTextToSize(plain, W - M*2 - indent);
      wrapped.forEach(w => { ensure(size+2); doc.text(w, M+indent, y); y += size + 4; });
      y += gap;
    });

    // Footer on every page
    const pageCount = doc.internal.getNumberOfPages();
    for (let i=1; i<=pageCount; i++) {
      doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(140,138,170);
      doc.text('contentcollectiv.co.uk', M, H - 20);
      doc.text(`Page ${i} / ${pageCount}`, W - M, H - 20, { align:'right' });
    }
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);
    doc.save(`content-collectiv-${slug || 'output'}.pdf`);
    showToast('✓ PDF downloaded');
  } catch (e) {
    console.error(e); showToast('PDF export failed');
  }
}

// ── TOAST (with Blab mascot) ──────────────────────────────────────────────
const BLAB = {
  default:  '/__l5e/assets-v1/5566a6e1-07de-47aa-bfff-df695da8d7d2/blab-default.png',
  wink:     '/__l5e/assets-v1/d60254ac-7aa5-47d4-9f97-c70330c830c7/blab-wink.png',
  thinking: '/__l5e/assets-v1/9ff5eb79-1177-4140-b3c5-e2cc64ba4683/blab-thinking.png',
  oops:     '/__l5e/assets-v1/31bc0f21-9899-44e4-8020-16d4d54fb1ad/blab-oops.png',
};
function showToast(msg) {
  const t = document.getElementById('toast');
  const text = String(msg || '');
  let variant = 'default', src = BLAB.default;
  if (/^✓|saved|copied|unlocked|sent|refined|cleared|written|downloaded|installed/i.test(text)) { variant='ok'; src = BLAB.wink; }
  else if (/fail|error|couldn|could not|oops|✗|✖|stopped|❌/i.test(text)) { variant='err'; src = BLAB.oops; }
  else if (/writing|generating|warming|wrangling|chasing|hunting|thinking|scanning|building|working/i.test(text)) { variant='think'; src = BLAB.thinking; }
  t.className = 'toast show ' + variant;
  t.innerHTML = '';
  const img = document.createElement('img'); img.className='blab'; img.src=src; img.alt='';
  const span = document.createElement('span'); span.textContent = text.replace(/^✓\s?/, '');
  t.appendChild(img); t.appendChild(span);
  setTimeout(() => t.classList.remove('show'), 2400);
}

// Quirky rotating loading lines — a bit of personality mid-wait
const LOADING_QUIPS = [
  'Warming up the word oven…',
  'Wrangling your brand voice…',
  'Chasing down the good ideas…',
  'Cutting the fluff, keeping the punch…',
  'Making it sound like you, not like AI…',
  'Ironing out the corporate wrinkles…',
  'Turning "synergy" into actual English…',

async function streamClaude(system, user, onChunk, moduleKey, opts = {}) {
  const userToken = (await getFreshToken()) || window.USER_TOKEN || SUPABASE_ANON_KEY;
  // Register an abort controller so the user's Stop button can cancel mid-stream
  const controller = new AbortController();
  window.IE_CURRENT_ABORT = controller;
  try { window.dispatchEvent(new CustomEvent('ie:streaming', { detail: { active: true } })); } catch {}
  let res;
  try {
    const headers = {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + userToken,
    };
    const pid = activeProjectId();
    if (pid) headers['x-project-id'] = pid;
    if (moduleKey) headers['x-module'] = moduleKey;
    const override = opts.brainOverride || (typeof isFreestyle === 'function' && isFreestyle());
    if (override) headers['x-brain-override'] = '1';
    res = await fetch(`${SUPABASE_URL}/functions/v1/engine-ai`, {

      headers,

      signal: controller.signal,

  } catch (err) {
    try { window.dispatchEvent(new CustomEvent('ie:streaming', { detail: { active: false } })); } catch {}
    if (err?.name === 'AbortError') { const e = new Error('Stopped'); e.aborted = true; throw e; }
    throw err;
  }

    let msg = "API error " + res.status;
    let code = null;
    let payload = null;
    try { payload = await res.json(); if (payload?.error) msg = payload.error; if (payload?.code) code = payload.code; } catch {}
    if (res.status === 428 && code === 'brain_incomplete' && !override) {
      try { window.dispatchEvent(new CustomEvent('ie:streaming', { detail: { active: false } })); } catch {}
      const missing = Array.isArray(payload?.missing) ? payload.missing : [];
      const list = missing.map(m => `  • ${m}`).join('\n');
      const proceed = window.confirm(
        `Your Strategy Profile is missing:\n\n${list}\n\nWithout this, the output will be generic and won't sound like your brand.\n\nOK  = Continue anyway (generic)\nCancel = Go set up my Brain first`
      );
      if (!proceed) {
        try { window.parent?.postMessage({ type: 'engine:goto', path: '/brain' }, '*'); } catch {}
        const e = new Error('Complete your Brain first for on-brand output.');
        e.aborted = true;
        throw e;
      }
      return await streamClaude(system, user, onChunk, moduleKey, { ...opts, brainOverride: true });
    }
    if (res.status === 429) msg = "Rate limit reached. Please try again in a moment.";
    if (res.status === 402 && ["plan_required", "trial_exhausted", "credits_exhausted", "feature_locked", "paywall"].includes(code)) {
      const friendly = code === "credits_exhausted"
        ? "You've used this month's generations. Upgrade to keep going."
        : (msg || "Choose a plan to continue.");
      window.IE.openPaywall(moduleKey, friendly, code);
      msg = friendly;
    } else if (res.status === 402) {
      msg = "Generation is unavailable right now. Please try again shortly.";
    }
    try { window.dispatchEvent(new CustomEvent('ie:streaming', { detail: { active: false } })); } catch {}
    throw new Error(msg);
  }


  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let full = "";
  let buf = "";
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const payload = trimmed.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        try {
          const d = JSON.parse(payload);
          const delta = d.choices?.[0]?.delta?.content;
          if (delta) { full += delta; onChunk(full); }
        } catch {}
      }
    }
  } catch (err) {
    if (err?.name === 'AbortError') {
      try { window.dispatchEvent(new CustomEvent('ie:streaming', { detail: { active: false } })); } catch {}
      if (full) return full; // return partial so it can still be saved
      const e = new Error('Stopped'); e.aborted = true; throw e;
    }
    throw err;
  } finally {
    try { window.dispatchEvent(new CustomEvent('ie:streaming', { detail: { active: false } })); } catch {}
    if (window.IE_CURRENT_ABORT === controller) window.IE_CURRENT_ABORT = null;
    // Ask parent for a fresh plan/usage snapshot so the counter widget updates.
    try { bumpPlanUsage(); } catch {}
  }
  return full;
}

function stopStreaming() {

}

// Pulls every markdown link [name](https://…) out of AI output, dedupes by URL,
// replaces the link inline with a numbered marker ⟦N⟧ so the reader sees a
// tidy superscript instead of a URL, and returns the sources list separately.
function extractSources(text) {
  if (!text) return { text: '', sources: [] };
  const sources = [];
  const byUrl = new Map();
  const linkRe = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let clean = text.replace(linkRe, (_, name, url) => {
    let i = byUrl.get(url);
    if (!i) { sources.push({ name: name.trim(), url }); i = sources.length; byUrl.set(url, i); }
    return `⟦${i}⟧`;
  });
  // Tidy the common "( ⟦1⟧ )" shape the AI writes after a stat.
  clean = clean
    .replace(/\s*\(\s*⟦(\d+)⟧\s*\)/g, ' ⟦$1⟧')
    .replace(/\s+([.,;:!?])/g, '$1');
  return { text: clean, sources };
}

// ── MARKDOWN RENDERER ──────────────────────────────────────────────────────
function Md({ text, sources }) {

      const m = p.match(/^⟦(\d+)⟧$/);

        const src = sources && sources[n - 1];
        if (src) {
          return React.createElement('sup', { key: i, style: { marginLeft: 2 } },
            React.createElement('a', {
              href: src.url,
              target: '_blank',

              style: { color: '#22d3ee', textDecoration: 'none', fontWeight: 700, fontSize: '0.78em', padding: '0 2px' }
            }, `[${n}]`)

        return React.createElement('sup', { key: i, style: { color: '#8b8baa', fontSize: '0.78em' } }, `[${n}]`);

  };

    }))
  });
}

// STRATEGY → CONTENT HELPERS (parse pillars/weeks, cross-module trigger)
// ══════════════════════════════════════════════════════════════════════════
function parseStrategy(text) {
  if (!text) return { pillars: [], weeks: [] };
  const pillars = [];

  // Grab the Content Pillars block if present; otherwise fall back to whole text
  // so we still recover pillars when the model omits or renames the heading.
  let block = text;
  const pm = text.match(/##\s+(?:Content\s+)?Pillars?[^\n]*\n([\s\S]*?)(?=\n##\s|$)/i);
  if (pm) block = pm[1];

  // Split into pillar sections by any of: "### heading", "**Pillar N**",
  // "- **Pillar N: ...**" (bulleted, which is what the generator emits),
  // or a leading "Pillar N:" / "1." on its own line.
  const parts = block.split(/\n(?=\s*(?:[-•*]\s*)?(?:###\s|\*\*\s*Pillar\b|Pillar\s*\d+\s*[:\-—]|\d+\.\s+\*\*))/i);

  parts.forEach(p => {
    let name = '';
    let body = p;
    const h3 = p.match(/^\s*###\s+(.+)/);
    const bold = p.match(/\*\*([^*\n]{2,80})\*\*/);
    const plain = p.match(/^\s*(?:[-•*]\s*)?(?:Pillar\s*\d+\s*[:\-—]\s*|\d+\.\s+)([^\n]{2,80})/i);
    if (h3) { name = h3[1]; body = p.slice(h3[0].length); }
    else if (bold) { name = bold[1]; }
    else if (plain) { name = plain[1]; }


    name = name.replace(/\*+/g,'').trim();
    for (let k = 0; k < 3; k++) {
      const before = name;
      name = name.replace(/^pillar\s*\d+\s*[:\-—\.\)]?\s*/i,'')
                 .replace(/^\d+\s*[\.\)\:\-—]\s*/,'')
                 .replace(/^[:\-—]\s*/,'')
                 .trim();
      if (name === before) break;
    }
    if (!name) return;

    const topics = [];
    const descLines = [];
    let seenBullet = false;
    body.split('\n').forEach(l => {
      const m = l.match(/^\s*[-•*]\s+(.+)/);
      if (!m) {
        if (!seenBullet) {
          const clean = l.replace(/\*\*/g,'').replace(/^\s*(?:description|purpose|why)\s*[:\-—]\s*/i,'').trim();
          if (clean) descLines.push(clean);
        }
        return;
      }
      seenBullet = true;
      let t = m[1].trim();
      // Skip the pillar's own title bullet (e.g. "- **Pillar 1: Trust builders**")
      if (/^\**\s*pillar\s*\d+\s*[:\-—]/i.test(t)) return;
      if (/^(purpose|name|why it works|why|description|format|goal|audience)\b/i.test(t)) {
        const dm = t.match(/^(?:purpose|why it works|why|description)\s*[:\-—]\s*(.+)$/i);
        if (dm) descLines.push(dm[1].replace(/\*\*/g,'').trim());
        return;
      }
      t = t.replace(/^\*\*([^*]+)\*\*\s*[:\-—]?\s*/,'$1: ').replace(/\*\*/g,'');

      for (let k = 0; k < 4; k++) {
        const before = t;
        t = t.replace(/^\s*\d+\s*[\.\)\:\-—]\s*/,'')
             .replace(/^(?:topic|example|idea|post|sub[- ]?topic)\s*\d*\s*[:\-—]\s*/i,'')
             .replace(/^[:\-—]\s*/,'')
             .trim();
        if (t === before) break;
      }
      if (t.length > 4 && !topics.includes(t)) topics.push(t);
    });
    const description = descLines.join(' ').replace(/\s+/g,' ').trim();
    if (topics.length && !pillars.some(x => x.name.toLowerCase() === name.toLowerCase())) {
      pillars.push({ name, description, topics: topics.slice(0,12) });
    }
  });

  const weeks = [];
  const wr = /(?:^|\n)\s*(?:\*\*|-\s*|###\s*)?Week\s*(\d+)[^\n]*?[:\-—]\s*([^\n]+)/gi;
  let m;
  while ((m = wr.exec(text)) !== null) {
    const weekNum = m[1];
    const topic = m[2].replace(/\*\*/g,'').replace(/^\s*[:\-—]\s*/,'').trim();
    if (topic && weeks.length < 12 && !weeks.some(w => w.week === `Week ${weekNum}`)) {
      weeks.push({ week: `Week ${weekNum}`, topic });
    }
  }
  return { pillars, weeks };
}

// ── STRATEGY / 90-DAY PLAN — structured view ──────────────────────────────
function parseStrategyPlan(text) {
  if (!text) return { overview:'', pillars:[], months:[], quickWins:[], kpis:[] };
  const sectionOf = (name) => {
    const re = new RegExp(`(?:^|\\n)##\\s+${name}[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'i');
    const m = text.match(re);
    return m ? m[1].trim() : '';
  };
  const bulletsOf = (block) => {
    const out = [];
    (block || '').split('\n').forEach(l => {
      const m = l.match(/^\s*(?:[-•*]|\d+\.)\s+(.+)/);
      if (!m) return;
      let t = m[1].replace(/\*\*/g,'').trim();
      if (t.length > 3) out.push(t);
    });
    return out;
  };
  const overviewBlock = sectionOf('Strategy\\s+Overview') || sectionOf('Overview');
  const overview = overviewBlock
    ? bulletsOf(overviewBlock).join(' • ') || overviewBlock.split('\n').map(l=>l.replace(/^[#>\-•*\s]+/,'').trim()).filter(Boolean).slice(0,3).join(' ')
    : '';

  const { pillars } = parseStrategy(text);

  const planBlock = sectionOf('90-?Day\\s+Plan') || sectionOf('Plan');
  const months = [];
  if (planBlock) {
    const parts = planBlock.split(/\n(?=###\s+Month\s*\d)/i);
    parts.forEach(p => {
      const h = p.match(/###\s+Month\s*(\d+)\s*[—\-–:]?\s*([^\n]*)/i);
      if (!h) return;
      const num = h[1];
      const theme = (h[2] || '').replace(/\*+/g,'').trim();
      const body = p.slice(h[0].length);
      // split into weeks
      const weeks = [];
      const wparts = body.split(/\n(?=\s*(?:\*\*|-\s*|###\s*)?Week\s*\d)/i);
      wparts.forEach(wp => {
        const wm = wp.match(/(?:\*\*|-\s*|###\s*)?Week\s*(\d+)[^\n]*?(?:[:\-—]\s*([^\n]+))?/i);
        if (!wm) return;
        const wn = wm[1];
        const title = (wm[2] || '').replace(/\*+/g,'').trim();
        const rest = wp.slice(wm[0].length);
        const items = bulletsOf(rest);
        if (title || items.length) weeks.push({ week: `Week ${wn}`, title, items });
      });
      months.push({ num, theme, weeks });
    });
  }

  const quickWins = bulletsOf(sectionOf('Quick\\s+Wins[^\\n]*'));
  const kpis = bulletsOf(sectionOf('KPIs[^\\n]*') || sectionOf('Metrics[^\\n]*'));

  return { overview, pillars, months, quickWins, kpis };
}

// ── WRITTEN POSTS STORE (Step ④ → calendar) ───────────────────────────────
// Backed by the `content_posts` table via the parent app. localStorage is kept
// only as an offline cache so the UI paints instantly.
const WRITTEN_KEY = 'ie-written-posts';
const WRITTEN_IMPORT_KEY = 'ie-written-imported';
function getWrittenPosts() {
  try { const v = JSON.parse(localStorage.getItem(scopedKey(WRITTEN_KEY)) || '[]'); return Array.isArray(v) ? v : []; } catch { return []; }
}
function setWrittenPosts(list) {
  try { localStorage.setItem(scopedKey(WRITTEN_KEY), JSON.stringify(list.slice(0, 120))); } catch {}
  try { window.dispatchEvent(new CustomEvent('ie:written-updated')); } catch {}
}
function writtenStatus(entry) {
  if (entry.scheduled) return 'scheduled';
  if (entry.approved) return 'approved';
  return 'draft';
}
function pushWrittenToServer(entry) {
  try {
    window.parent?.postMessage({
      type: 'engine:content-save',
        projectId: activeProjectId(),
      post: {
        id: entry.dbId || undefined,
        caption: entry.body || '',
        title: entry.topic || '',
        platform: /instagram/i.test(entry.format || '') ? 'instagram'
          : /facebook/i.test(entry.format || '') ? 'facebook'
          : /tiktok/i.test(entry.format || '') ? 'tiktok'
          : 'linkedin',
        pillar: entry.pillar || '',
        status: writtenStatus(entry),
        plan_slot: entry.id || '',
      },
    }, '*');
  } catch {}
}
function saveWrittenPost({ topic, format, body }) {
  if (!topic || !body) return;
  const cleanTopic = String(topic).replace(/^\[[^\]]+\]\s*/, '').trim();
  const pillar = (String(topic).match(/^\[([^\]]+)\]/) || [])[1] || '';
  const list = getWrittenPosts();
  const id = (cleanTopic + '|' + (format || '')).toLowerCase();
  const entry = { id, topic: cleanTopic, pillar, format: format || '', body: String(body), approved: false, scheduled: false, at: Date.now() };
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) { entry.approved = list[i].approved; entry.scheduled = list[i].scheduled; entry.dbId = list[i].dbId; list[i] = entry; }
  else list.unshift(entry);
  setWrittenPosts(list);
  pushWrittenToServer(entry);
}
function updateWrittenPost(id, patch) {
  const next = getWrittenPosts().map(x => x.id === id ? { ...x, ...patch } : x);
  setWrittenPosts(next);
  const hit = next.find(x => x.id === id);
  if (hit) pushWrittenToServer(hit);
}
function removeWrittenPost(id) {
  const hit = getWrittenPosts().find(x => x.id === id);
  setWrittenPosts(getWrittenPosts().filter(x => x.id !== id));
  if (hit && hit.dbId) { try { window.parent?.postMessage({ type: 'engine:content-delete', id: hit.dbId }, '*'); } catch {} }
}
// Hydrate from the database, importing anything that only ever lived here.
function requestWrittenSync() {
  try { window.parent?.postMessage({ type: 'engine:content-list', projectId: activeProjectId() }, '*'); } catch {}
}
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'engine:content-saved' && d.post) {
    const slot = d.post.plan_slot;
    if (!slot) return;
    const list = getWrittenPosts().map(x => x.id === slot ? { ...x, dbId: d.post.id } : x);
    try { localStorage.setItem(scopedKey(WRITTEN_KEY), JSON.stringify(list.slice(0, 120))); } catch {}
  }
  if (d.type === 'engine:content-data' && Array.isArray(d.posts)) {
    if (typeof d.projectId === 'string' && d.projectId !== activeProjectId()) return;
    const local = getWrittenPosts();
    const remote = d.posts.map(p => ({
      id: p.plan_slot || p.id,
      dbId: p.id,
      topic: p.title || (p.caption || '').slice(0, 60),
      pillar: p.pillar || '',
      format: p.platform || '',
      body: p.caption || '',
      approved: p.status === 'approved' || p.status === 'scheduled' || p.status === 'published',
      scheduled: p.status === 'scheduled' || p.status === 'published',
      at: new Date(p.created_at || Date.now()).getTime(),
    }));
    const remoteIds = new Set(remote.map(r => r.id));
    const orphans = local.filter(l => !l.dbId && !remoteIds.has(l.id));
    if (orphans.length && localStorage.getItem(scopedKey(WRITTEN_IMPORT_KEY)) !== '1') {
      try { localStorage.setItem(scopedKey(WRITTEN_IMPORT_KEY), '1'); } catch {}
      try {

          projectId: activeProjectId(),
          posts: orphans.map(o => ({ caption: o.body || '', title: o.topic || '', platform: 'linkedin', pillar: o.pillar || '' })),
        }, '*');
      } catch {}
      return;
    }
    setWrittenPosts(remote.concat(orphans));
  }
});

    const rule = fmtRules[p.format] || `Write in the native style and length for ${p.format}.`;

    const prompt = `Write a complete ${p.format}.

Topic: ${p.topic}
CTA to use (verbatim — do not paraphrase into a different offer): ${ctaLine}${voiceCtx}${brainCtx}

PLATFORM RULES (must follow exactly):
${rule}

General requirements:

- Teach something genuinely useful, no fluff
- Sound human, not like marketing copy
- Match the length and structure above — do not write a generic post
- FACTS: every concrete detail (products, features, timelines, materials, guarantees, testimonials, prices, stats) must come from the BUSINESS BRAIN block above. If a detail isn't there, WRITE AROUND IT — do not invent.
- BRAND CREDENTIALS: do NOT open the post with, or lean on, generic brand credentials (years trading, staff count, number of warehouses, family-run, service area, awards). These belong on an About page, not in every post. Mention at most ONE credential, and only if it directly serves this specific topic. The hook and body must be about the reader's problem/curiosity, not about the business.

- CTA: use only the CTA specified above. Never invent a "Comment [KEYWORD]" mechanic, never offer a guide/PDF/checklist/price list unless explicitly listed in the Brain.

Output ONLY the finished post in the exact format described. No preamble, no "Here is your post:".` + recentOutputsCtx(['ie-mod-content-out']);
  return { sys, prompt };
}

/** Write one caption/post inline (used by the Captions tab). */
async function generateCaptionInline({ pillar, topic, format }, voice, onChunk) {
  const finalTopic = pillar ? `[${pillar}] ${topic}` : topic;
  const p = { topic: finalTopic, format: format || 'LinkedIn thought leadership post', cta: '' };
  const { sys, prompt } = buildPostPrompt(p, voice);
  let finalText = '';
  await streamClaude(sys, prompt, t => { finalText = t; if (onChunk) onChunk(t); }, 'content');
  if (finalText && !/^Error:/.test(finalText)) {
    saveWrittenPost({ topic: finalTopic, format: p.format, body: finalText });
  }
  return finalText;
}


/** Three-to-five concrete post angles derived straight from the Strategy Profile. */
function brainTopicIdeas() {
  const b = (typeof activeBrain === 'function') ? activeBrain() : null;
  if (!b) return [];
  const split = (v, max) => String(v || '')
    .split(/\n|;|·|(?<=\.)\s+/)
    .map(s => s.replace(/^[\s\-•*\d.]+/, '').trim())
    .filter(s => s.length > 8 && s.length < 160)
    .slice(0, max);
  const pains = split(b.audience?.pain_points, 2);
  const services = split(b.business?.products_services, 2);
  const customer = String(b.audience?.ideal_customer || '').split(/[.\n]/)[0]?.trim();
  const industry = String(b.business?.industry || '').trim();
  const out = [];
  if (pains[0]) out.push(`The mistake behind “${pains[0]}” — and how we fix it`);
  if (services[0]) out.push(`What actually happens when someone chooses ${services[0]}`);
  if (customer) out.push(`What ${customer} should check before buying${industry ? ' in ' + industry : ''}`);
  if (pains[1]) out.push(`A straight answer to “${pains[1]}”`);
  if (services[1]) out.push(`Is ${services[1]} right for you? An honest look`);
  if (industry) out.push(`Three things people get wrong about ${industry}`);
  return out.filter(Boolean).slice(0, 5);
}

const CAPTION_FORMATS = [
  { label: 'LinkedIn post', fmt: 'LinkedIn thought leadership post', len: '~120 words' },
  { label: 'LinkedIn carousel', fmt: 'LinkedIn carousel script', len: '6–8 slides' },
  { label: 'Facebook post', fmt: 'Facebook Business Page post', len: '~70 words' },
  { label: 'Instagram', fmt: 'Instagram caption', len: '~70 words (excl. hashtags)' },
  { label: 'X thread', fmt: 'Twitter/X thread', len: '5–8 tweets' },
  { label: 'Blog', fmt: 'Blog post (full)', len: '~800 words' },
  { label: 'Newsletter', fmt: 'Newsletter section', len: '~250 words' },
  { label: 'YouTube', fmt: 'YouTube video script', len: '~400 words' }
];
const LAST_FMT_KEY = 'ie-last-format';
const CARD_FMT_KEY = 'ie-card-formats';
function readCaptionFormat() {
  try { return loadLS(LAST_FMT_KEY, CAPTION_FORMATS[0].fmt); } catch (e) { return CAPTION_FORMATS[0].fmt; }
}
function readCardFormats() {
  try { return loadLS(CARD_FMT_KEY, {}) || {}; } catch (e) { return {}; }
}
function getCardFormat(key) {
  const m = readCardFormats();
  return m[key] || readCaptionFormat();
}
function setCardFormat(key, v) {
  try {
    const m = readCardFormats();
    m[key] = v;
    saveLS(CARD_FMT_KEY, m);
    saveLS(LAST_FMT_KEY, v);
  } catch (e) {}
  try { window.dispatchEvent(new CustomEvent('ie:format-changed', { detail: { key, fmt: v } })); } catch (e) {}
}
function useCardFormat(key) {
  const [fmt, setFmt] = React.useState(() => getCardFormat(key));
  React.useEffect(() => { setFmt(getCardFormat(key)); }, [key]);
  React.useEffect(() => {
    const h = e => { if (!e.detail || e.detail.key === key) setFmt(getCardFormat(key)); };
    window.addEventListener('ie:format-changed', h);
    return () => window.removeEventListener('ie:format-changed', h);
  }, [key]);
  return [fmt, v => setCardFormat(key, v)];
}


/** Writes every outstanding caption in one go. */
function WriteAllCaptions({ pillars, weeks, voice }) {
  const [busy, setBusy] = React.useState(false);
  const [done, setDone] = React.useState(0);
  const [, bump] = React.useReducer(x => x + 1, 0);
  React.useEffect(() => {
    const h = () => bump();
    window.addEventListener('ie:written-updated', h);
    window.addEventListener('ie:format-changed', h);
    return () => { window.removeEventListener('ie:written-updated', h); window.removeEventListener('ie:format-changed', h); };
  }, []);

  const jobs = [];
  (pillars || []).forEach(p => (p.topics || []).forEach(t => jobs.push({ pillar: p.name, topic: t })));
  (weeks || []).forEach(w => jobs.push({ pillar: null, topic: w.topic }));
  const written = getWrittenPosts();
  const outstanding = jobs.filter(j => {
    const clean = String(j.pillar ? '[' + j.pillar + '] ' + j.topic : j.topic).replace(/^\[[^\]]+\]\s*/, '').trim();
    const f = getCardFormat(clean);
    return !written.some(w => w.id === (clean + '|' + f).toLowerCase());
  });

  const runAll = async () => {
    if (busy || !outstanding.length) return;
    setBusy(true); setDone(0);
    for (const j of outstanding.slice(0, 12)) {
      if (!window.IE.tryUse('content')) break;
      const clean = String(j.pillar ? '[' + j.pillar + '] ' + j.topic : j.topic).replace(/^\[[^\]]+\]\s*/, '').trim();
      try { await generateCaptionInline({ pillar: j.pillar, topic: j.topic, format: getCardFormat(clean) }, voice); } catch (e) {}
      setDone(d => d + 1);
    }
    setBusy(false);
    showToast('✓ Captions ready — preview, edit or approve each one');
  };

  return React.createElement('div', { className:'handoff-panel', style:{ marginBottom:14 } },
    React.createElement('div', { className:'handoff-copy' },
      React.createElement('div', { className:'handoff-title' },
        outstanding.length ? 'Write all content — ' + outstanding.length + ' caption' + (outstanding.length === 1 ? '' : 's') + ' still to write' : '✓ Every caption is written'),
      React.createElement('div', { className:'handoff-sub' }, 'Pick a format on each topic below, then write them one by one or all in one go.')
    ),

    React.createElement('div', { className:'handoff-actions' },
      outstanding.length ? React.createElement('button', { className:'btn btn-yellow btn-sm', onClick:runAll, disabled:busy },
        busy ? ('Writing… ' + done + '/' + Math.min(outstanding.length, 12)) : '✍️ Write all content') : null,
      React.createElement('button', {
        className:'btn btn-sm', style:{ background:'rgba(255,255,255,0.06)' },
        onClick:()=>{ try { window.parent?.postMessage({ type:'engine:navigate', to:'/calendar' }, '*'); } catch (e) {} }
      }, 'Open content calendar →')
    )
  );
}


function SuggestionPanel({ strategyText, brainTopics, voice, pillarFilter }) {
  // The plan saved against this workspace wins; the old browser copy is a fallback.
  const savedPlan = useSavedStrategyPlan();
  let pillars = [], weeks = [];

    pillars = (savedPlan.pillars || []).map(p => ({
      name: String(p.name || 'Pillar'),
      topics: Array.isArray(p.topics) ? p.topics.map(String) : [],
    })).filter(p => p.topics.length);
    weeks = (savedPlan.weeks || []).map(w => ({
      week: 'Week ' + (w.week || ''),
      topic: String(w.theme || w.focus || ''),

  if (!pillars.length && !weeks.length) {
    const parsed = parseStrategy(strategyText);
    pillars = parsed.pillars; weeks = parsed.weeks;

  // Fallback: if the parser can't find structured pillars but strategy text
  // exists, extract every bulleted line as a flat "All topics" pillar so the
  // user always has clickable topics to write posts from.
  if ((!pillars.length && !weeks.length) && strategyText) {
    const topics = [];
    strategyText.split('\n').forEach(l => {
      const m = l.match(/^\s*[-•*]\s+(.+)/) || l.match(/^\s*\d+\.\s+(.+)/);

      let t = m[1].replace(/\*\*/g,'').trim();
      // skip label-only bullets
      if (/^(purpose|name|why it works|format|goal|audience|kpi|target|metric)\b/i.test(t)) return;
      if (t.length > 6 && t.length < 220 && !topics.includes(t)) topics.push(t);

const STRATEGY_NOTES_KEY = 'ie-strategy-notes';
function strategyNotes() {
  try { const v = JSON.parse(localStorage.getItem(scopedKey(STRATEGY_NOTES_KEY)) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function addStrategyNote(source, text) {
  const body = (text || '').trim();
  if (!body) return false;
  const notes = strategyNotes();
  if (notes.some(n => n.text === body)) return false;
  notes.push({ source, text: body.slice(0, 6000), at: Date.now() });
  try { localStorage.setItem(scopedKey(STRATEGY_NOTES_KEY), JSON.stringify(notes.slice(-12))); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent('ie:strategy-notes')); } catch (e) {}
  return true;
}
function removeStrategyNote(at) {
  try { localStorage.setItem(scopedKey(STRATEGY_NOTES_KEY), JSON.stringify(strategyNotes().filter(n => n.at !== at))); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent('ie:strategy-notes')); } catch (e) {}
}

  const notes = strategyNotes();

BRAIN:
${brainJson}

${currentJson}

Output EXACTLY this format (keep the labels):

BUSINESS:
(1–2 short sentences. What they actually do and who for. Plain English.)

AUDIENCE:

TONE:

      let full = '';
