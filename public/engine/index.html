function CompetitorHandoff({ out }) {
  const gaps = React.useMemo(() => {
    if (!out || out.length < 40) return [];
    // Prefer the "gaps to own" or "content gaps" section; fall back to "post ideas"
    const secMatch = out.match(/##[^\n]*(?:gaps?\s+to\s+own|content\s+gaps|opportunit(?:y|ies)|angles?\s+.*not\s+covering|ready[- ]to[- ]brief|post\s+ideas)[^\n]*\n([\s\S]*?)(?=\n##\s|$)/i);
    const section = secMatch ? secMatch[1] : out;
    const lines = section.split('\n');
    const bullets = [];
    for (const raw of lines) {
      const l = raw.trim();
      const m = l.match(/^(?:[-*•]|\d+[\.)])\s+(.+)/);
      if (!m) continue;
      let t = m[1].replace(/\*\*/g,'').replace(/`/g,'').trim();
      // strip a leading "Topic:" / "Idea:" label
      t = t.replace(/^(topic|idea|hook|angle|gap)\s*[:\-—]\s*/i,'').trim();
      if (t.length > 10 && t.length < 320 && !bullets.includes(t)) bullets.push(t);
    }
    return bullets.slice(0, 12);
  }, [out]);

  const addToPlan = (gap) => {
    let existing = '';
    try { existing = JSON.parse(localStorage.getItem(scopedKey('ie-mod-strategy-out')) || '""') || ''; } catch { existing = ''; }
    const line = `- ${gap}`;
    let next;
    if (/##\s*Competitor gaps to own/i.test(existing)) {
      if (existing.includes(line)) { showToast('Already in your plan'); return existing; }
      next = existing.replace(/(##\s*Competitor gaps to own\s*\n)([\s\S]*?)(?=\n##\s|$)/i, (_m, h, body) => h + body.replace(/\s*$/, '') + '\n' + line + '\n');
    } else {
      next = (existing ? existing.replace(/\s*$/, '') + '\n\n' : '') + '## Competitor gaps to own\n' + line + '\n';
    }
    saveLS('ie-mod-strategy-out', next);
    window.dispatchEvent(new CustomEvent('ie:strategy-updated'));
    return next;
  };

  const handleAddAll = () => { gaps.forEach(addToPlan); showToast(`✓ Added ${gaps.length} gap${gaps.length===1?'':'s'} to your plan`); };

  if (!out || !gaps.length) return null;

  return React.createElement('div', { className:'handoff-panel' },
    React.createElement('div', { className:'handoff-copy' },
      React.createElement('div', { className:'handoff-title' }, '⇢ Send these into your workflow'),
      React.createElement('div', { className:'handoff-sub' }, `${gaps.length} competitor gap${gaps.length===1?'':'s'} ready for your 90-day plan.`)
    ),
    React.createElement('div', { className:'handoff-actions' },
      React.createElement('button', { className:'btn btn-yellow btn-sm', onClick:handleAddAll }, '＋ Add all to plan'),
      React.createElement('button', {
        className:'btn btn-sm',
        style:{ background:'rgba(255,255,255,0.06)' },
        onClick:()=>window.dispatchEvent(new CustomEvent('ie:nav', { detail:{ page:'strategy' } }))
      }, 'Open 90-day plan →')
    )
  );
}

// --- file attachments: read documents client-side into plain text ---------
const ATTACH_MAX_CHARS = 30000;
const ATTACH_MAX_BYTES = 15 * 1024 * 1024;

function loadScriptOnce(src) {
  window.__ieScripts = window.__ieScripts || {};
  if (window.__ieScripts[src]) return window.__ieScripts[src];
  window.__ieScripts[src] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Could not load reader'));
    document.head.appendChild(s);
  });
  return window.__ieScripts[src];
}

async function readAttachmentText(file) {
  if (file.size > ATTACH_MAX_BYTES) throw new Error(file.name + ' is too large (max 15MB)');
  const name = (file.name || 'file').toLowerCase();
  const ext = name.split('.').pop();

  if (ext === 'pdf') {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    const pdfjs = window.pdfjsLib;
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const doc = await pdfjs.getDocument({ data: buf }).promise;
    let out = '';
    for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      out += content.items.map(i => i.str).join(' ') + '\n\n';
      if (out.length > ATTACH_MAX_CHARS) break;
    }
    if (!out.trim()) throw new Error(file.name + ' has no readable text (it may be a scanned image)');
    return out;
  }

  if (ext === 'docx') {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    const buf = await file.arrayBuffer();
    const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
    if (!r?.value?.trim()) throw new Error(file.name + ' has no readable text');
    return r.value;
  }

  const textish = ['txt','md','markdown','csv','tsv','json','html','htm','rtf','log','yml','yaml','xml'];
  if (textish.includes(ext) || (file.type || '').startsWith('text/')) {
    return await file.text();
  }

  throw new Error('Unsupported file type: .' + ext + ' — use PDF, DOCX, TXT, MD or CSV');
}

function Chat({ plan, projects, activeProjectId: pid, onSwitchProject }) {
  const chatKey = (projectId) => 'ie_chat_' + (projectId || 'default');
  const loadThread = (projectId) => {
    try { return JSON.parse(sessionStorage.getItem(chatKey(projectId)) || '[]'); } catch { return []; }
  };
  const [messages, setMessages] = React.useState(() => {
    return loadThread(pid);
  });
  const [input, setInput] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [streamText, setStreamText] = React.useState('');
  const [files, setFiles] = React.useState([]);       // [{ name, text }]
  const [reading, setReading] = React.useState(false);
  const responseStartRef = React.useRef(null);
  const inputRef = React.useRef(null);
  const fileRef = React.useRef(null);
  const docsRef = React.useRef([]);
  const activeThreadRef = React.useRef(pid || 'default');
  const skipNextThreadSaveRef = React.useRef(false);
  const shouldScrollToResponseRef = React.useRef(false);


  const pickFiles = async (list) => {
    const chosen = Array.from(list || []);
    if (!chosen.length) return;
    setReading(true);
    for (const f of chosen) {
      try {
        const text = await readAttachmentText(f);
        setFiles(prev => [...prev, { name: f.name, text: text.slice(0, ATTACH_MAX_CHARS) }].slice(-5));
      } catch (e) { showToast('⚠️ ' + (e?.message || 'Could not read that file')); }
    }
    setReading(false);
    if (fileRef.current) fileRef.current.value = '';
  };


  React.useEffect(() => {
    const nextThread = pid || 'default';
    if (activeThreadRef.current === nextThread) return;
    activeThreadRef.current = nextThread;
    skipNextThreadSaveRef.current = true;
    setMessages(loadThread(pid));
    setInput('');
    setFiles([]);
    setStreamText('');
    docsRef.current = [];
    if (window.IE_CURRENT_ABORT) {
      try { window.IE_CURRENT_ABORT.abort(); } catch {}
      window.IE_CURRENT_ABORT = null;

    setBusy(false);

  React.useEffect(() => {
    if (skipNextThreadSaveRef.current) {
      skipNextThreadSaveRef.current = false;
      return;
    }
    try { sessionStorage.setItem(chatKey(pid), JSON.stringify(messages.slice(-40))); } catch {}
  }, [messages, pid]);
  React.useEffect(() => {
    if (!shouldScrollToResponseRef.current || !busy) return;
    responseStartRef.current?.scrollIntoView({ behavior:'smooth', block:'start' });
    shouldScrollToResponseRef.current = false;
  }, [busy, streamText]);
  React.useEffect(() => { inputRef.current?.focus(); }, [pid]);

  const unlimited = !plan || plan.limit == null;
  const remaining = unlimited ? Infinity : Math.max(0, (plan.limit || 0) - (plan.used || 0));
  const outOfCredit = !unlimited && remaining <= 0;

    const attached = files;

    const label = attached.length ? attached.map(f => '📎 ' + f.name).join('\n') + (text ? '\n\n' : '') : '';
    const history = [...messages, { role:'user', content: label + (text || 'Please read the attached file(s).') }];
    setMessages(history);
    setInput('');
    setFiles([]);
    setBusy(true);
    setStreamText('');
    shouldScrollToResponseRef.current = true;

    const brainCtx = activeBrainContext();
    const system = withVoiceRules(`You are the user's senior marketing strategist inside haaylo — a thinking partner for open-ended brainstorming, questions and feedback on half-formed ideas.

- The BUSINESS BRAIN supplied below is the ground truth about this business. Use it to answer brand-specific questions directly and confidently. Never ask the user to re-explain details already in the Brain.

- If the user has attached documents, treat their contents as reference material supplied by the user. Quote and work from what's actually in them; never invent details they don't contain.
- Answer naturally, in UK English, and keep it as short or as detailed as the question warrants.
- Ask a sharp follow-up question when it would genuinely help move the thinking on.
- The banned-construction rules above apply to conversational replies exactly as they do to generated posts: never negate one framing to assert another ("we aren't building X, we're building Y"). Write plain positive statements.
${brainCtx || '\n=== BUSINESS BRAIN ===\nThis client has no saved Brain details yet. Do not borrow details from another client.\n=== END BUSINESS BRAIN ==='}`);

    const convo = history.slice(-16).map(m => `${m.role === 'user' ? 'USER' : 'ASSISTANT'}: ${m.content}`).join('\n\n');
    const docs = docsRef.current.length
      ? 'ATTACHED DOCUMENTS:\n' + docsRef.current.map(d => `--- ${d.name} ---\n${d.text}`).join('\n\n') + '\n\n'
      : '';
    const user = `${docs}CONVERSATION SO FAR:\n${convo}\n\nReply as ASSISTANT to the latest USER message.`;


    let acc = '';
    try {
      const full = await streamClaude(system, user, (chunk) => { acc += chunk; setStreamText(acc); }, 'chat');
      setMessages(m => [...m, { role:'assistant', content: (full || acc || '').trim() }]);
    } catch (err) {
      if (acc.trim()) setMessages(m => [...m, { role:'assistant', content: acc.trim() }]);
      else if (!err?.aborted) showToast('⚠️ ' + (err?.message || 'Something went wrong'));
    } finally {
      setBusy(false);
      setStreamText('');
      inputRef.current?.focus();
    }
  };

  const bubble = (role) => ({
    maxWidth: '86%',
    alignSelf: role === 'user' ? 'flex-end' : 'flex-start',
    background: role === 'user' ? 'linear-gradient(135deg,#A855F7,#3B82F6)' : 'transparent',
    color: role === 'user' ? '#fff' : 'var(--ink)',
    border: role === 'user' ? 'none' : '1px solid var(--border)',
    borderRadius: 14,
    padding: role === 'user' ? '10px 14px' : '12px 14px',
    fontSize: 14, lineHeight: 1.6, whiteSpace: 'pre-wrap'
  });

  return React.createElement('div', null,
    React.createElement('h1', { className:'h1' }, '💬 Brainstorm'),
    React.createElement('p', { className:'sub' }, 'Think out loud with an assistant that already knows your business. Each response draws from your brand strategy.'),
    React.createElement(ModuleWorkspaceBar, { projects, activeProjectId: pid, onSwitchProject }),

    React.createElement('div', {
      style:{ display:'flex', flexDirection:'column', gap:14,
              minHeight: messages.length || streamText ? 200 : 'auto',
              maxHeight:'52vh', overflowY:'auto',
              padding:'16px', borderRadius:14, border:'1px solid var(--border)', background:'rgba(255,255,255,0.02)' }
    },
      messages.length === 0 && !streamText && React.createElement('div', { style:{ color:'#9b9bb8', fontSize:14, lineHeight:1.7 } },

function GenCoin({ plan, onClick }) {
  return null; // generation coin badge removed
  if (!plan) return null;
  const unlimited = plan.limit == null;
  const used = plan.used || 0;
  const limit = plan.limit ?? 0;
  const remaining = unlimited ? Infinity : Math.max(0, limit - used);
  const pct = unlimited ? 0 : (limit > 0 ? Math.min(100, (used/limit)*100) : 0);
  const warn = !unlimited && pct >= 80 && pct < 100;
  const danger = !unlimited && pct >= 100;
  const ring = unlimited
    ? 'linear-gradient(135deg,#22D3EE,#A78BFA)'
    : danger ? 'linear-gradient(135deg,#F87171,#EF4444)'
    : warn ? 'linear-gradient(135deg,#FBBF24,#F59E0B)'
    : 'linear-gradient(135deg,#22D3EE,#A78BFA)';
  const display = unlimited ? '∞' : String(remaining);
  const tierLabels = { none:'Free trial', starter:'Starter', pro:'Pro', expert:'Expert' };
  const tip = unlimited
    ? `${tierLabels[plan.tier]||''} · Unlimited generations`
    : `${remaining} of ${limit} generations left${plan.tier?' · '+(tierLabels[plan.tier]||''):''}`;
  return React.createElement('button', {
    className: 'gen-coin' + (danger?' danger':'') + (warn?' warn':''),

    style: { background: ring }

      React.createElement('span', { className:'gen-coin-icon' }, '⚡'),
      React.createElement('span', { className:'gen-coin-num' }, display)

}

function useDashboardData() {
  const [dash, setDash] = React.useState(null);
  React.useEffect(() => {
    const h = (e) => {
      const d = e && e.data;
      if (d && d.type === 'engine:dashboard-data' && d.dashboard) setDash(d.dashboard);
    };
    window.addEventListener('message', h);
    const ask = () => { try { window.parent?.postMessage({ type:'engine:dashboard' }, '*'); } catch (err) {} };
    ask();
    const t = setInterval(ask, 120000);
    return () => { window.removeEventListener('message', h); clearInterval(t); };
  }, []);
  return dash;
}

function ChannelPerformance() {
  const [connected, setConnected] = React.useState(null);
  const [posts, setPosts] = React.useState(null);

  React.useEffect(() => {
    (async () => {
      try {
        const tok = await getFreshToken();
        if (!tok) { setConnected({}); setPosts([]); return; }
        setConnected(await loadConnectedAccounts(tok));
        const res = await fetch('/api/public/zernio-metrics?days=30', { headers:{ Authorization:'Bearer ' + tok } });
        const body = await res.json();
        setPosts(res.ok && body.ok !== false ? (body.posts || []) : []);
      } catch (e) { setConnected({}); setPosts([]); }
    })();
  }, []);

  const now = Date.now();
  const stats = (id) => {
    const list = (posts || []).filter(p => (p.platform || '').toLowerCase() === id && p.publishedAt);
    const win = (from, to) => list.filter(p => {
      const t = new Date(p.publishedAt).getTime();
      return t > now - from * 86400000 && t <= now - to * 86400000;
    });
    const rate = (rows) => {
      const imp = rows.reduce((n, p) => n + (p.impressions || 0), 0);
      const eng = rows.reduce((n, p) => n + (p.likes || 0) + (p.comments || 0) + (p.shares || 0), 0);
      return imp > 0 ? (eng / imp) * 100 : null;
    };
    const recent = win(7, 0), prior = win(14, 7);
    const a = rate(recent), b = rate(prior);
    return { posts: recent.length, rate: a, change: (a !== null && b !== null && b > 0) ? a - b : null };
  };

  return React.createElement('section', { style: DASH_SECTION },
    React.createElement('div', { style: DASH_LABEL }, 'Channel performance · last 7 days'),
    React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(190px, 1fr))', gap:12 } },
      CHANNELS.map(ch => {
        const conn = connected && connected[ch.id];
        const s = stats(ch.id);
        const up = s.change !== null && s.change >= 0;
        return React.createElement('div', {
          key: ch.id,
          style:{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:'14px 16px' }
        },
          React.createElement('div', { style:{ display:'flex', alignItems:'center', gap:8, marginBottom:10 } },
            React.createElement('span', { style:{ fontSize:16 } }, PLAT_ICON[ch.id] || '📣'),
            React.createElement('span', { style:{ fontSize:13, fontWeight:800, color:'#F5F3FF' } }, ch.name),
            conn && conn.name ? React.createElement('span', { style:{ fontSize:11, color:'#8a8fb0', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, conn.name) : null
          ),
          connected === null
            ? React.createElement('div', { style:{ fontSize:12, color:'#8a8fb0' } }, 'Checking…')
            : !conn
              ? React.createElement('div', null,
                  React.createElement('div', { style:{ fontSize:12, color:'#8a8fb0', marginBottom:10 } }, 'Not connected yet'),
                  React.createElement('button', { className:'btn btn-sm', onClick: () => goRoute('/connect') }, 'Connect')
                )
              : React.createElement('div', null,
                  React.createElement('div', { style:{ fontSize:12.5, color:'#dcdcef' } },
                    `${s.posts} post${s.posts === 1 ? '' : 's'} in the last 7 days`),
                  React.createElement('div', { style:{ fontSize:12.5, color:'#8a8fb0', marginTop:4 } },
                    s.rate === null ? 'No engagement data yet' : `Engagement ${s.rate.toFixed(1)}%`),
                  s.change !== null
                    ? React.createElement('div', { style:{ fontSize:12, fontWeight:700, marginTop:6, color: up ? '#86EFAC' : '#FCA5A5' } },
                        `${up ? '▲' : '▼'} ${Math.abs(s.change).toFixed(1)} pts vs the week before`)
                    : null
                )
        );
      })
    )
  );
}

function HomeStateB({ nav, voice, unlocked, brainScore, firstName }) {

  // ── Signals from persisted module state ────────────────────────────────
  // Values are persisted with JSON.stringify (saveLS), so read + parse.
  // Fall back to the raw string if it wasn't JSON-encoded (older data).
  const lsGet = (k, fb='') => {
    try {
      const v = localStorage.getItem(scopedKey(k));
      if (v == null) return fb;
      try { const p = JSON.parse(v); return typeof p === 'string' ? p : (p ?? fb); }
      catch { return v; }
    } catch { return fb; }
  };
  const lsJSON = (k, fb=null) => { try { const v = localStorage.getItem(scopedKey(k)); return v ? JSON.parse(v) : fb; } catch { return fb; } };
  const has = (v) => !!v && String(v).trim().length > 20;
  const voiceLocked  = !!(voice && (typeof voice.business === 'string' ? voice.business.trim() : voice.business?.name));
  const planDone     = has(lsGet('ie-mod-strategy-out'));
  const contentDone  = has(lsGet('ie-mod-content-out'));
  const funnelDone   = has(lsGet('ie-mod-funnel-mag')) || has(lsGet('ie-mod-funnel-email'));
  const keywordsDone = has(lsGet('ie-mod-keywords-out'));
  const analyticsDone= has(lsGet('ie-mod-analytics-insight'));

  // Persisted "skipped/acknowledged" map — once a user has clicked a suggested action
  // (or chose "skip for now"), don't keep suggesting the same step forever, even if
  // the underlying data can't be collected yet (e.g. analytics with no traffic).
  const [skipped, setSkipped] = usePersisted('ie-home-step-skipped', {});
  const markSkipped = (id) => { if (id && !skipped[id]) setSkipped({ ...skipped, [id]: true }); };

  const rawChecklist = [
    { id:'voice',       label:'Lock in your Brand Voice',         done: voiceLocked,          target:'voice' },
    { id:'competitors', label:'Scan your Competitor Radar',       done: competitorRadarDone(),target:'competitors' },
    { id:'trends',      label:'Scan live Trends',                 done: trendRadarDone(),     target:'trends' },
    { id:'plan',        label:'Generate your 90-Day Plan',        done: planDone,             target:'strategy' },
    { id:'content',     label:'Draft your first Post or Caption', done: contentDone,          target:'content' },
    { id:'funnel',      label:'Build a Lead Funnel',              done: funnelDone,           target:'funnel' },
    { id:'keywords',    label:'Pick your SEO Keywords',           done: keywordsDone,         target:'keywords' },
  ];

  const checklist = rawChecklist.map(c => ({ ...c, done: c.done || !!skipped[c.id] }));
  const completed = checklist.filter(c => c.done).length;
  const total = checklist.length;
  const planPct = Math.round((completed / total) * 100);
  const nextAction = checklist.find(c => !c.done);

  // GA4: onboarding_step_completed (once per step, once per browser)
  React.useEffect(() => {
    if (!window.gaOnce || !window.gaEvent) return;
    checklist.forEach(c => {
      if (c.done) {
        window.gaOnce('ga:onboarding_completed:' + c.id, () => {
          window.gaEvent('onboarding_step_completed', { step_id: c.id, step_name: c.label });
        });
      }
    });
  }, [voiceLocked, planDone, contentDone, funnelDone, keywordsDone, analyticsDone]);

  // ── Plan / generation counter ─────────────────────────────────────────
  const [plan, setPlan] = React.useState(() => window.IE_PLAN || DEFAULT_FREE_PLAN);
  React.useEffect(() => {
    const h = () => setPlan(window.IE_PLAN ? { ...window.IE_PLAN } : DEFAULT_FREE_PLAN);
    window.addEventListener('ie:plan', h);
    // Ask parent for a fresh snapshot on mount in case it hasn't pushed one yet
    try { window.parent?.postMessage({ type: 'engine:get-plan' }, '*'); } catch {}
    return () => window.removeEventListener('ie:plan', h);
  }, []);

  // ── Momentum: daily ping + rolling 7-day activity ─────────────────────
  const today = new Date().toISOString().slice(0,10);
  const log = lsJSON('ie-momentum-log', []) || [];
  if (!log.includes(today)) {
    log.push(today);
    const cutoff = new Date(Date.now() - 60*86400000).toISOString().slice(0,10);
    const trimmed = log.filter(d => d >= cutoff);
    try { localStorage.setItem(scopedKey('ie-momentum-log'), JSON.stringify(trimmed)); } catch {}
  }
  const dset = new Set(log); dset.add(today);
  let streak = 0;
  for (let i = 0; i < 60; i++) {
    const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
    if (dset.has(d)) streak++; else break;
  }
  const last7 = Array.from({length:7}, (_,i) => {
    const d = new Date(Date.now() - (6-i)*86400000).toISOString().slice(0,10);
    return { d, active: dset.has(d) };
  });

  // ── Quick Wins & KPIs from Analytics + 90-Day Plan ────────────────────
  const rawInsight = lsGet('ie-mod-analytics-insight', '');
  const analyticsWins = (() => {
    if (!rawInsight) return [];
    const secMatch = rawInsight.match(/##\s*Top\s*\d*\s*Actions[^\n]*\n([\s\S]*?)(?:\n##|$)/i);
    const block = secMatch ? secMatch[1] : rawInsight;
    return block.split('\n')
      .map(l => l.replace(/^\s*[-*•]\s+/, '').trim())
      .filter(l => l && !l.startsWith('#') && l.length > 8 && l.length < 260)
      .slice(0, 5);
  })();

  const rawPlan = lsGet('ie-mod-strategy-out', '');
  const parsedPlan = React.useMemo(() => rawPlan ? parseStrategyPlan(rawPlan) : { quickWins:[], kpis:[] }, [rawPlan]);
  // Fallback extraction if the model didn't use the exact "## Quick Wins" heading
  const fallbackExtract = (src, headingRe) => {
    if (!src) return [];
    const m = src.match(headingRe);
    if (!m) return [];
    const idx = m.index + m[0].length;
    const rest = src.slice(idx);
    const end = rest.search(/\n(?:##|###)\s+/);
    const block = end === -1 ? rest : rest.slice(0, end);
    return block.split('\n')
      .map(l => l.replace(/^\s*[-*•\d.]+\s+/, '').replace(/\*\*/g,'').trim())
      .filter(l => l && !l.startsWith('#') && l.length > 6 && l.length < 260)
      .slice(0, 6);
  };
  const planWins = (parsedPlan.quickWins && parsedPlan.quickWins.length)
    ? parsedPlan.quickWins.slice(0, 6)
    : fallbackExtract(rawPlan, /(?:^|\n)#{1,3}\s*Quick\s*Wins[^\n]*/i);
  const planKPIs = (parsedPlan.kpis && parsedPlan.kpis.length)
    ? parsedPlan.kpis.slice(0, 6)
    : fallbackExtract(rawPlan, /(?:^|\n)#{1,3}\s*(?:KPIs?|Metrics)[^\n]*/i);
  const hasPlanWins = planWins.length > 0;
  const hasAnalyticsWins = analyticsWins.length > 0;

  const [doneWins, setDoneWins] = usePersisted('ie-home-quickwins-done', {});
  const toggleWin = (key) => setDoneWins({ ...doneWins, [key]: !doneWins[key] });

  // ── Live content snapshot from the account (not localStorage) ─────────
  const [snap, setSnap] = React.useState(null);
  React.useEffect(() => {
    const h = (e) => {
      const d = e.data;
      if (d && d.type === 'engine:home-snapshot-data' && d.snapshot) setSnap(d.snapshot);
    };
    window.addEventListener('message', h);
    try { window.parent?.postMessage({ type: 'engine:home-snapshot' }, '*'); } catch {}
    return () => window.removeEventListener('message', h);
  }, []);

  const [showSteps, setShowSteps] = React.useState(false);
  const [showWins, setShowWins] = React.useState(false);
  const remainingSteps = checklist.filter(c => !c.done && (!nextAction || c.id !== nextAction.id));

  const card = (icon, title, desc, target) => React.createElement('button', {
    onClick: () => nav(target),
    style: {
      textAlign:'left', cursor:'pointer',
      background:'rgba(255,255,255,0.03)',
      border:'1px solid rgba(255,255,255,0.08)',
      borderRadius:16, padding:'16px 16px', color:'#F5F5FF',
      fontFamily:"'Space Grotesk', system-ui, sans-serif",
      transition:'transform .18s, border-color .18s, background .18s',
      display:'flex', flexDirection:'column', gap:6, position:'relative'
    },
    onMouseEnter: (e) => { e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.borderColor='rgba(168,85,247,0.4)'; e.currentTarget.style.background='rgba(255,255,255,0.05)'; },
    onMouseLeave: (e) => { e.currentTarget.style.transform=''; e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'; e.currentTarget.style.background='rgba(255,255,255,0.03)'; }
  },
    React.createElement('div', { style:{ fontSize:20 } }, icon),
    React.createElement('div', { style:{ fontFamily:"'Archivo Black', sans-serif", fontSize:13.5, letterSpacing:'.02em', textTransform:'uppercase', color:'#F5F3FF' } }, title),
    React.createElement('div', { style:{ fontSize:12.5, lineHeight:1.5, color:'#8a8fb0' } }, desc)
  );

  const stat = (label, value, tone) => React.createElement('div', {
    style:{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:'14px 16px' }
  },
    React.createElement('div', { style:{ fontFamily:"'Archivo Black',sans-serif", fontSize:26, lineHeight:1, color: tone || '#F5F3FF' } }, value),
    React.createElement('div', { style:{ fontSize:11.5, marginTop:6, color:'#8a8fb0', letterSpacing:'.04em' } }, label)
  );

  const statusLabel = { draft:'Draft', approved:'Approved', scheduled:'Scheduled', published:'Published' };

  // ── Live account dashboard (counts, channels, leads) ──────────────────
  const dash = useDashboardData();
  const planDay = snap && snap.planDay ? snap.planDay : null;
  const tier = (plan && plan.tier) || 'none';

  // The Briefing Room is the one home screen now; this view only offers the tools.
  React.useEffect(() => {
    try { window.parent?.postMessage({ type:'engine:navigate', to:'/home' }, '*'); } catch (e) {}
  }, []);

  return React.createElement('div', null,
    React.createElement('section', { style:{ padding:'8px 4px 4px' } },
      React.createElement('h1', { style:{ fontFamily:"'Archivo Black',sans-serif", fontSize:'clamp(22px,3vw,30px)', lineHeight:1.15, margin:0, color:'#F5F3FF' } }, 'Taking you to your Briefing Room…'),
      React.createElement('p', { style:{ margin:'10px 0 0', fontSize:13.5, color:'#8a8fb0' } }, 'Your dashboard now lives there. The tools below are still here whenever you need them.')
    ),

    // ── Modules, kept quiet at the bottom ────────────────────────────────
    React.createElement('div', { style:{ marginTop:30, fontSize:11, fontWeight:800, letterSpacing:'.14em', textTransform:'uppercase', color:'#8a8fb0' } }, 'Jump into a tool'),
    React.createElement('div', {
      style:{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:12, marginTop:12 }
    },
      card('🎙️', 'Brand Voice', 'How your business sounds in every post.', 'voice'),
      card('🗺️', '90-Day Plan', 'Your month-by-month content calendar.', 'strategy'),
      card('✍️', 'Content Tools', 'On-brand captions ready to schedule.', 'content'),
      card('🧲', 'Lead Funnels', 'Lead magnets and email follow-ups.', 'funnel'),
      card('🔎', 'SEO Keywords', 'Phrases your customers search for.', 'keywords'),
      card('📊', 'Analytics', 'Every number from every channel.', 'analytics')
    )
  );
}

    keywords:  'Pick SEO Keywords',
    analytics: 'Get first Analytics insight'

  const [brainScore, setBrainScore] = useState(null);

  const [brainLoaded, setBrainLoaded] = useState(false);

  // Per-workspace brand voice. Storage key: `ie-voice::<projectId>` (with a

    strategy: '/__l5e/assets-v1/9b57ab16-029b-4954-81f1-4bbe2f71d214/nav-plan.png',
    content: '/__l5e/assets-v1/8dd0595f-0b35-453d-89b7-931c9cafdd19/nav-posts.png',
    competitors: '/__l5e/assets-v1/42c01f45-02d6-49e9-b82c-5a248fa9149c/nav-radar.png',
    analytics: '/__l5e/assets-v1/11a94d81-63c8-44ef-8d57-b1b21615cc5e/nav-analytics.png',
    funnel: '/__l5e/assets-v1/6e1f4a13-b676-4056-a410-5860f991e821/nav-leadgen.png',
    keywords: '/__l5e/assets-v1/4cc4f5fa-2c60-48fe-b92e-fb8476bf9a7f/nav-seo.png',
  };
  const renderIcon = (id, fallback) => navIcons[id]

  const navItems = [
    { id:'home', icon:'⌂', label:'Home' },

    { id:'content', icon:'✍️', label:'Write content tools' },
    { id:'funnel', icon:'🧲', label:'Lead Funnels' },
    { id:'keywords', icon:'🔍', label:'SEO & keywords' },
    { id:'analytics', icon:'📊', label:'Analytics & Insights' },
    { id:'chat', icon:'💬', label:'Brainstorm' },
  ];
  const bottomNav = [
    { id:'home', icon:'⌂', label:'Home' },
    { id:'brain', icon:'🧠', label:'Brain' },
    { id:'voice', icon:'🎙️', label:'Voice' },
    { id:'competitors', icon:'🎯', label:'Radar' },
    { id:'trends', icon:'📡', label:'Trends' },
    { id:'strategy', icon:'🗺️', label:'Plan' },
    { id:'content', icon:'✍️', label:'Posts' },
    { id:'funnel', icon:'🧲', label:'Leads' },
    { id:'keywords', icon:'🔍', label:'SEO' },
    { id:'analytics', icon:'📊', label:'Analytics' },
    { id:'chat', icon:'💬', label:'Chat' },
  ];
  const navOrder = ['home','voice','competitors','trends','strategy','content','funnel','keywords','analytics','chat'];

  const lockedForNav = (id) => {

    if (id === 'home' || id === 'analytics') return false;
